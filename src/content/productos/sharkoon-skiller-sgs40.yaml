veredicto: "La Skiller SGS40 busca el confort en una gaming racing de precio razonable, y destaca por el asiento extra ancho de casi 60 cm y la espuma moldeada de alta densidad, además de una certificación EN 1335 y un pistón certificado que dan tranquilidad sobre la construcción. Suma mecanismo de balanceo con bloqueo, reposabrazos 4D y reclinación hasta 160°. El respaldo es de polipiel sobre espuma, con una variante en tejido más fresca, así que en verano conviene valorar la opción de tela. Para quien necesita más anchura de asiento de la habitual y no quiere pagar de más, es una compra sensata."
