veredicto: "La Master es la gaming con la que DXRacer intenta dar el salto a la ergonomía seria: lo mejor es su lumbar integrado 4D con seis niveles de ajuste, que se mueve en altura y profundidad en lugar de ser un simple cojín, acompañado de reposabrazos 4D y un pistón clase 4 certificado por SGS. La estética es más ejecutiva y discreta que la racing típica. Los peros pesan: la garantía es de solo dos años cuando la competencia da cinco, el precio es alto y el asiento es algo estrecho, así que no es la mejor para cuerpos anchos. Para quien busca lumbar regulable de verdad en formato gaming y no le importa la garantía corta, cumple."
