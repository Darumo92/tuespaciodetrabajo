en:
  nombreComercial: "DXRacer Master"
  veredicto: "The Master is the gaming chair with which DXRacer tries to move into serious ergonomics: the best part is its 4D integrated lumbar with six adjustment levels, which moves in height and depth instead of being a simple cushion, paired with 4D armrests and an SGS-certified class 4 piston. The look is more executive and discreet than the typical racing chair. The downsides weigh: the warranty is only two years when rivals give five, the price is high and the seat is somewhat narrow, so it isn't the best for broad bodies. For anyone wanting a genuinely adjustable lumbar in a gaming format who doesn't mind the short warranty, it delivers."
  idealPara: "Anyone wanting a genuinely adjustable integrated 4D lumbar in a gaming chair with a more executive look"
  comunidad: "Mixed-positive reception in reviews (ChairsFX, PC Gamer, TechRadar): the 4D integrated adjustable lumbar, the modular design expandable with accessories and the executive look are valued. The recurring criticisms are the short two-year warranty versus brands that give five, the high price and a somewhat narrow seat that doesn't suit broad bodies well."
  resumenCompra:
    mejorPara: "Anyone wanting an adjustable 4D integrated lumbar in a sober-looking gaming chair."
    evitarSi: "You're after a long warranty, a better price or you're broad-build."
    alternativaDirecta: "Razer Iskur V2 if you want an adjustable adaptive lumbar with a better warranty."
    decisionRapida: "The gaming chair I'd recommend to anyone who values an adjustable integrated lumbar over warranty and price."
  puntosFuertes:
    - "4D integrated lumbar with six adjustment levels"
    - "4D armrests"
    - "SGS-certified class 4 piston"
    - "Modular design expandable with accessories"
    - "SGS, BIFMA and TÜV certifications"
  puntosDebiles:
