veredicto: "El TROTTEN es la puerta de entrada de IKEA a los escritorios elevables y su gracia es hacer lo justo por poco dinero: un escritorio completo, de manivela manual, que sube de 70 a 120 cm girando el mango, sin motor ni electrónica que se estropee ni cables que enchufar. La manivela se monta a izquierda o derecha y se esconde bajo el tablero cuando no se usa, y las patas se regulan para nivelarlo en suelos irregulares. Como todo IKEA de oficina, llega con 10 años de garantía y homologación profesional (EN 527-2 y BIFMA). Los peros son los propios de un manual: aguanta 50 kg —lo justo para un monitor y poco más— y cambiar de altura cuesta girar unas cuantas vueltas, así que no es para quien alterna postura a todas horas. Pero como elevable de marca, fiable y barato para empezar, es de lo más sensato."
