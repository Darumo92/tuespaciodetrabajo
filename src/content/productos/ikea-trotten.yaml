en:
  nombreComercial: "IKEA TROTTEN Manual Crank Standing Desk"
  tituloCorto: "IKEA Trotten"
  veredicto: "The TROTTEN is IKEA's entry into standing desks, and its charm is doing just enough for little money: a complete desk, manual crank, that rises from 70 to 120 cm by turning the handle, with no motor or electronics to break and no cables to plug in. The crank mounts left or right and tucks under the top when not in use, and the legs adjust to level it on uneven floors. Like all IKEA office furniture, it comes with a 10-year warranty and professional certification (EN 527-2 and BIFMA). The catches are those of any manual: it holds 50 kg —enough for a monitor and little more— and changing height takes a few turns, so it's not for anyone switching posture constantly. But as a reliable, cheap brand-name standing desk to start with, it's very sensible."
  idealPara: "Anyone who wants a cheap, electronics-free IKEA standing desk, with a reversible crank and a 10-year warranty, to switch sit-stand without relying on an outlet"
  comunidad: "Reviews highlight how cheap and reliable it is for an IKEA product, with a 10-year warranty, and details like the reversible tuck-away crank and leveling legs. Criticisms are those of any manual: cranking gets tiring if you switch posture often, and load is low. As a first brand-name standing desk, the rating is good."
  resumenCompra:
    mejorPara: "A cheap, electronics-free IKEA standing desk, with a crank and a 10-year warranty, for calm use."
    evitarSi: "You switch sit-stand many times a day or load over 50 kg: go electric."
    alternativaDirecta: "IKEA MITTZON or IDÅSEN for an IKEA motor; Duronic TM00 for an even cheaper manual frame without a top."
    decisionRapida: "IKEA's cheapest, reliable manual standing desk with a 10-year warranty; the catch is cranking the handle and the 50 kg load."
  puntosFuertes:
