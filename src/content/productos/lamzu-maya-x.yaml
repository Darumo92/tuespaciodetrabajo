en:
  nombreComercial: LAMZU MAYA X
  idealPara: Low-weight use across work and gaming on the same computer
  veredicto: The LAMZU MAYA X prioritizes low weight at a listed 47 g. Compare its connections and controls with an office mouse before paying for gaming features.
  resumenCompra:
    mejorPara: A work-and-gaming computer where a lightweight mouse matters more than extra wheels and shortcuts.
    evitarSi: You need Bluetooth, a dedicated horizontal wheel or quick switching between several devices.
    alternativaDirecta: The MX Master 4 focuses on productivity wheels and features; the M650 covers simpler tasks with Bluetooth.
  metodologia:
    - This is the mouse model I use, as recorded in the project's setup documentation. That does not amount to a hands-on comparison with the other four mice.
    - Published LAMZU information and the black Amazon Spain variant were checked on 17 September 2026. No latency or battery-life measurements were performed.
  limitaciones:
    - The listing states up to 8000 Hz with an 8K receiver; the receiver included with this ASIN has not been confirmed.
    - A symmetrical shell does not mean side buttons on both sides. Check their layout for left-handed use.
    - Dimensions have not been confirmed in a readable source for this variant and are left as n/a.
  paraQuienSi:
    - People seeking one lightweight mouse for work and gaming on the same computer.
    - Users happy with a receiver or cable instead of Bluetooth.
  paraQuienNo:
    - Anyone needing direct Bluetooth pairing with a laptop or tablet.
    - Users prioritizing a horizontal wheel, quiet clicks or quick device switching.
  puntosFuertes:
    - Listed at 47 g, lighter than the other four mice in this batch.
    - Radiofrequency and USB connections in the checked variant.
    - PAW3950 sensor and optical switches documented in the product listing.
  puntosDebiles:
    - The checked listing does not include Bluetooth among its connections.
    - Gaming sensor features do not replace Easy-Switch or a horizontal wheel.
    - Check the included receiver before buying specifically for 8000 Hz.
