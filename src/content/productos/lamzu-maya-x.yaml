idealPara: Quien prioriza poco peso y comparte el ratón entre trabajo y videojuegos
veredicto: El LAMZU MAYA X prioriza ligereza con sus 47 g publicados. Compara sus conexiones y botones con un ratón de oficina antes de pagar por prestaciones gaming.
resumenCompra:
  mejorPara: Un equipo en el que trabajas y juegas, cuando prefieres un ratón ligero a uno con varias ruedas y muchos atajos.
  evitarSi: Necesitas Bluetooth, una rueda horizontal dedicada o un cambio rápido entre varios equipos.
  alternativaDirecta: El MX Master 4 apuesta por ruedas y funciones de productividad; el M650 cubre tareas sencillas con Bluetooth.
metodologia:
  - Este es el modelo de ratón que uso, según el setup documentado del proyecto. Esa experiencia no es una prueba comparativa de los otros cuatro modelos.
  - La ficha separa ese uso propio de los datos publicados por LAMZU y de la variante negra consultada en Amazon.es el 17 de septiembre de 2026. No se han medido latencia ni autonomía.
limitaciones:
  - La ficha comercial indica hasta 8000 Hz al usar un receptor 8K; no se ha confirmado el receptor incluido en este ASIN.
  - La carcasa simétrica no implica botones laterales en ambos lados. Revisa su distribución si lo usarás con la izquierda.
  - Las medidas no se han confirmado en una fuente legible para esta variante y se dejan sin dato.
paraQuienSi:
  - Quien busca un único ratón ligero para trabajar y jugar en el mismo ordenador.
  - Usuarios que aceptan conexión por receptor o cable en lugar de Bluetooth.
paraQuienNo:
  - Quien necesita Bluetooth para conectarse directamente a un portátil o tableta.
  - Usuarios que priorizan una rueda horizontal, clics silenciosos o cambio rápido entre equipos.
puntosFuertes:
  - Peso publicado de 47 g, menor que el de los otros cuatro ratones de este lote.
  - Conexión por radiofrecuencia y USB en la variante consultada.
  - Sensor PAW3950 e interruptores ópticos documentados en la ficha comercial.
puntosDebiles:
  - La oferta consultada no incluye Bluetooth entre sus conexiones.
  - Las prestaciones de sensor para videojuegos no sustituyen funciones de oficina como Easy-Switch o una rueda lateral.
  - Conviene confirmar qué receptor llega en la caja antes de comprar por los 8000 Hz.
