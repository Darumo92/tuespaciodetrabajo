idealPara: "Quien quiere un escritorio elevable completo y barato pero con panel digital de 4 memorias y puerto USB-C, y agradece la variedad de tamaños y colores"
veredicto: "El SONGMICS LSD132 es el rival directo del Devoko en la gama de entrada, y le gana en electrónica: por un precio parecido trae panel digital con cuatro memorias, atenuación continua de la altura y puerto USB-C, además de venderse en muchos tamaños (120, 140, 160, 180 cm) y colores. Sigue siendo un escritorio de motor único, así que la subida no es rápida y la carga se queda en 70 kg, pero el marco de acero y la superficie gruesa aguantan bien un uso normal y el ruido se mantiene por debajo de 48 dB. Es la opción lógica si el Devoko se te queda corto de memorias o quieres USB-C, o si necesitas un ancho concreto que la competencia barata no ofrece. No es un escritorio para subir y bajar todo el día ni para montajes pesados —para eso hace falta doble motor— pero como primer elevable con mejor panel que la media de su precio, es de lo más recomendable."
