veredicto: "La SL5000 es la silla gaming racing con la que Vertagear apuesta por la durabilidad: base de aluminio de cinco radios, espuma UPHR de alta resiliencia y un chasis de acero con diez años de garantía, una cobertura poco habitual en esta categoría. El respaldo es de polipiel sobre espuma, no de malla, así que en verano calienta más, y conviene tener claro que esos diez años cubren el chasis, mientras que el resto de componentes quedan en dos años. Los reposabrazos 4D y los cojines lumbar y cervical de viscoelástica desmontables completan una propuesta sólida para quien busca una gaming bien construida y no le importa pagar por encima de la media."
