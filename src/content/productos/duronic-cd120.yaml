en:
  nombreComercial: "Duronic CD120 Electric Standing Desk 120x60 cm with Tabletop"
  tituloCorto: "Duronic CD120"
  veredicto: "The Duronic CD120 is the complete version —with a 120x60 cm tabletop included— of Duronic's standing range, a British brand very present and well rated on Amazon.es. Unlike its frames (sold without a tabletop), the CD120 arrives ready to use: electric, with a 72 to 118 cm height range and up to 70 kg of load, on height-adjustable feet that help level it on uneven floors. It's a mid-to-low-end proposition for everyday remote work: it does the job for sitting and standing with a monitor and peripherals, without the perks of a high-end dual motor (more speed, more load and greater firmness at height). Its strength is simplicity: a complete standing desk from a proven brand, without choosing or assembling a separate tabletop. If you need more load or switch posture many times a day, look at a dual motor; for normal use, it's a safe buy."
  idealPara: "Anyone who wants a complete electric standing desk, with a 120x60 tabletop included, from a well-established Amazon.es brand, without the hassle of choosing frame and tabletop separately"
  comunidad: "Duronic is among the best-selling brands on Amazon.es for standing desks and frames. Reviews of its range highlight the sturdy steel, easy assembly and value; the CD120, arriving complete with a tabletop, appeals to anyone who doesn't want the hassle of choosing frame and tabletop separately. The usual caveat is that the motor and load are mid-range, not premium dual-motor."
  resumenCompra:
    mejorPara: "A complete, simple standing desk for daily remote work, tabletop included and from a proven brand."
    evitarSi: "You switch posture many times a day or load heavy gear: you'll want a higher-capacity dual motor."
    alternativaDirecta: "Duronic TM61 if you prefer to choose your own tabletop with a dual motor; SONGMICS LSD132 or Devoko 120x60 for the same complete format cheaper; Maidesite T2 Pro Plus to move up to a dual motor and 160 kg."
    decisionRapida: "Duronic's complete electric standing desk with a 120x60 tabletop; simple and from a reliable brand, but mid-to-low-end motor."
  puntosFuertes:
    - "Complete standing desk with a 120x60 tabletop included"
    - "British brand well established and rated on Amazon.es"
    - "Height-adjustable feet to level on uneven floors"
    - "Ready to use without choosing or assembling a separate tabletop"
  puntosDebiles:
    - "Mid-to-low-end motor and load (70 kg)"
    - "Somewhat short top height (118 cm)"
    - "Details like memories, USB or anti-collision unconfirmed"
  paraQuienSi:
