veredicto: "El Duronic CD120 es la versión completa —con tablero de 120x60 cm incluido— de la gama elevable de Duronic, una marca británica muy presente y bien valorada en Amazon.es. A diferencia de sus marcos (que se venden sin tablero), el CD120 llega listo para usar: eléctrico, con rango de altura de 72 a 118 cm y hasta 70 kg de carga, sobre patas de altura regulable que ayudan a nivelarlo en suelos irregulares. Es una propuesta de gama media-baja pensada para el teletrabajo cotidiano: cumple para alternar sentado y de pie con un monitor y periféricos, sin las prestaciones de un doble motor de gama alta (más velocidad, más carga y mayor firmeza en altura). Su baza es la sencillez: un escritorio elevable completo de una marca contrastada, sin tener que elegir ni montar tablero aparte. Si necesitas más carga o alternas postura muchas veces al día, mira un doble motor; para un uso normal, es una compra segura."
resumenCompra:
  mejorPara: "Un escritorio elevable completo y sencillo para teletrabajo diario, con tablero incluido y de marca contrastada."
  evitarSi: "Alternas postura muchas veces al día o cargas equipo pesado: te conviene un doble motor de más carga."
  alternativaDirecta: "Duronic TM61 si prefieres elegir tu propio tablero con doble motor; SONGMICS LSD132 o Devoko 120x60 si buscas el mismo formato completo más barato; Maidesite T2 Pro Plus para dar el salto a doble motor y 160 kg."
  decisionRapida: "Elevable eléctrico completo de Duronic con tablero de 120x60; sencillo y de marca fiable, pero motor de gama media-baja."
