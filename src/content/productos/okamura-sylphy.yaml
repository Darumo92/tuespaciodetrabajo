veredicto: "La Sylphy es la ergonómica premium de Okamura, una marca japonesa con mucho prestigio en oficina de alto nivel. Su seña de identidad es el respaldo en curva S, que sostiene la zona lumbar y la dorsal con una línea pensada para acompañar la columna, y un mecanismo sincro que reclina hasta 23 grados con basculación frontal de 10 grados regulable con dial. El cojín de asiento es multidensidad, más blando delante y más firme detrás. No se vende en Amazon España y suele ir bajo pedido con plazos largos, así que es una compra de canal especializado más que de consumo, y el precio acompaña a esa categoría."
