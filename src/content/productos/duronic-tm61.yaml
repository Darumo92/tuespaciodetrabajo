en:
  nombreComercial: "Duronic TM61 Electric Standing Desk Frame with Dual Motor"
  tituloCorto: "Duronic TM61"
  veredicto: "The Duronic TM61 is an electric standing-desk frame (no tabletop) with a dual motor, meant for anyone who wants to reuse their current tabletop or fit a custom one. Duronic is a British brand with a huge presence on Amazon.es, and the TM61 raises the bar over more basic frames: a dual motor with a 72 to 120 cm range, up to 80 kg of load and a panel with height memories. Being a frame, the width adjusts to different tabletops, giving flexibility for L-shaped or large setups. It doesn't include a tabletop, so you must add that to the budget (your own or bought separately), and it isn't the fastest or highest-capacity frame around —that's the 120-160 kg high-end frames. But as an affordable dual motor from a proven brand, it's a solid base to build your standing desk your way."
  idealPara: "Anyone who already has, or wants to choose, their own tabletop and is after an affordable dual-motor electric standing-desk frame from a well-established Amazon.es brand"
  comunidad: "Duronic is among the best-selling and best-rated standing-desk frame brands on Amazon.es. Reviews of its frames highlight the sturdy steel, easy assembly and value; the TM61, being dual-motor, is seen as a step up from the brand's single-motor frames. The usual caveat is remembering the tabletop isn't included."
  resumenCompra:
    mejorPara: "Building a custom standing desk reusing or choosing your own tabletop, with a dual motor and at a good price."
    evitarSi: "You want a complete ready-to-use desk: you need a model with the tabletop included."
