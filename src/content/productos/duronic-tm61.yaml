idealPara: "Quien ya tiene o quiere elegir su propio tablero y busca una estructura elevable eléctrica de doble motor a buen precio, de una marca muy asentada en Amazon.es"
veredicto: "El Duronic TM61 es una estructura elevable eléctrica (sin tablero) de doble motor, pensada para quien quiere reutilizar su tablero actual o elegir uno a medida. Duronic es una marca británica con enorme presencia en Amazon.es, y el TM61 sube la apuesta frente a marcos más básicos: doble motor con rango de 72 a 120 cm, hasta 80 kg de carga y panel con memorias de altura. Al ser marco, el ancho se ajusta a distintos tableros, lo que le da flexibilidad para montajes en L o superficies grandes. No incluye tablero, así que hay que sumarlo al presupuesto (propio o comprado aparte), y tampoco es la estructura más rápida ni la de mayor carga del mercado —para eso están los marcos de 120-160 kg de gama alta—. Pero como doble motor asequible de una marca contrastada, es una base sólida para montar tu escritorio elevable a tu gusto."
