veredicto: "La RECARO Exo no es una gaming racing reclinable al uso, sino una silla de concha de asiento ergonómica fabricada en Alemania que aplica el saber hacer de RECARO en motorsport. En lugar de tumbarse, ofrece cuatro posiciones de asiento preconfiguradas (Attack, Core Focus, Core Relax y Recharge), un respaldo de concha individualizable con espuma fría y tejidos transpirables, y un resalte antideslizamiento que evita escurrirse hacia delante. Lleva lumbar fijo integrado y reposabrazos 4D acolchados en el modelo base; las versiones FX y Platinum suben a 5D y base de aluminio. Es una compra premium para quien valora postura firme y construcción seria por encima de un reclinado profundo."
