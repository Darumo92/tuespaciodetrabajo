en:
  nombreComercial: "Drift DR500"
  veredicto: "The DR500 is Drift's gaming chair aimed above all at taller users: its backrest is high, it supports up to 150 kg and it has 4D armrests, lumbar and neck cushions and a class 4 gas piston. The finish is faux leather, so it breathes less than a fabric or mesh chair, and the recline reaches 135 degrees, enough to lean back but not to lie fully flat. As an affordable, sturdy gaming chair for tall people, it does the job well."
  idealPara: "Budget gaming for tall users with 4D armrests"
  comunidad: "Spanish-language reviews place it as a solid, affordable gaming chair especially recommended for tall people, with good support and a sturdy build. The usual criticisms are that the faux leather runs warm, that the chair sits high for users under 1.80 m and that the lumbar is a cushion, not integrated."
  resumenCompra:
    mejorPara: "Tall users wanting a sturdy gaming chair with 4D armrests at a contained price."
    evitarSi: "You're under 1.75 m or need breathable mesh or fabric."
    alternativaDirecta: "Newskill Takamikura if you prefer breathable fabric and 180° recline."
    decisionRapida: "The affordable gaming chair I'd recommend to a tall person who wants something sturdy without overspending."
  puntosFuertes:
    - "High backrest designed for tall people"
    - "Supports up to 150 kg"
    - "4D armrests"
    - "Lumbar and neck cushions included"
    - "Class 4 gas piston and metal base"
  puntosDebiles:
    - "Faux-leather backrest, warm in summer"
    - "Recline limited to 135°"
    - "Sits high for shorter users"
  paraQuienSi:
