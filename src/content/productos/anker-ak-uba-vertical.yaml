en:
  nombreComercial: Anker A7852 (AK-98ANWVM-UBA)
  tituloCorto: Anker A7852
  idealPara: One computer with USB-A and no mouse cable across the desk
  veredicto: >-
    The Anker A7852 is a basic right-handed vertical mouse with a USB-A receiver
    and two AAA batteries, not included. It suits people who want to remove the
    cable and do not need Bluetooth; forward and back functions are unavailable on Mac.
  resumenCompra:
    mejorPara: >-
      Working mainly on one computer with a spare USB-A port, three sensitivity
      settings and replaceable batteries rather than a battery that needs charging.
    evitarSi: >-
      You need Bluetooth, device switching at the press of a button, wired
      operation or working forward and back buttons on Mac.
    alternativaDirecta: >-
      The USB-A Perixx PERIMICE-513 sends input and draws power through its 1.8 m
      cable. Choose it instead if you prefer leaving the mouse connected without
      having to replace batteries.
    decisionRapida: >-
      Check your computer's port first, then whether you can reach the wheel and
      upper control without changing your grip. Budget for two AAA batteries;
      a laptop with only USB-C needs a compatible adapter or hub.
  metodologia:
    - >-
      We checked Anker's official pages alongside reviews from Tom's Guide,
      Digital Camera World and HardwareZone, consulted on 3 October 2026.
      We have not tested this mouse or measured battery life, accuracy or noise.
    - >-
      Features and compatibility come from Anker. Comments about grip and the
      wheel are the reviewers' impressions, not our own testing or a guarantee
      that the shape will fit every hand.
  limitaciones:
    - >-
      The shopping search can return other models. Check reference A7852, also
      documented as AK-98ANWVM-UBA, and black variant A7852011. A similar picture
      does not confirm that a listing is for this version.
    - >-
      The budget tier is indicative, based on an Amazon Spain check on 3 October
      2026. It is not a fixed price or stock guarantee; check the conditions of
      the offer you choose, including any Prime requirement. No US offer is confirmed.
    - >-
      Anker lists Windows, Linux and Mac OS X support but says forward and back
      do not work on Mac. This does not promise every function on every system version.
    - >-
      We use the corroborated metric dimensions of 120 x 62.8 x 74.8 mm;
      other official fields in inches conflict. Weight remains unconfirmed
      for this profile.
    - >-
      There is no verified numerical hand-size cutoff or comfort test from us.
      Check the return conditions before buying so you can assess control reach
      with your own hand.
  paraQuienSi:
    - >-
      Right-handed users who want to try a vertical grip without adding a cable
      across the area where they move the mouse.
    - >-
      People working on one computer who can spare a USB-A port for the receiver;
      moving to another computer means moving the receiver too.
    - >-
      People who prefer replacing two AAA batteries and want to store the
      receiver inside the mouse when carrying it.
  paraQuienNo:
    - People needing a left-handed model or one shared by left- and right-handed users.
    - Anyone needing Bluetooth or device switching without moving a receiver.
    - Mac users who rely on forward and back buttons in their daily work.
    - Anyone needing confirmed programmable-button support or documented quiet clicks.
  puntosFuertes:
    - >-
      Optical tracking and a 2.4 GHz wireless connection through a USB-A receiver,
      without a cable between the mouse and computer.
    - >-
      Settings of 800, 1200 and 1600 DPI let you change sensitivity on the mouse
      itself. The highest setting does not inherently mean better accuracy.
    - >-
      Left and right clicks, wheel click and two forward/back buttons, plus a
      separate DPI control. These are basic functions, not a button-programming promise.
    - >-
      Receiver storage and an underside power switch. Anker says the mouse
      sleeps after eight idle minutes and wakes with a left or right click.
  puntosDebiles:
    - >-
      It needs two AAA batteries that are not included. There is no USB charging
      or wired operation; the idle sleep delay is not a battery-life figure.
    - >-
      The receiver is its only connection. A laptop without USB-A still needs
      a way to connect it, even though the mouse is wireless.
    - >-
      The side buttons lose forward and back functions on Mac. If you use those
      shortcuts daily, having the physical buttons does not resolve the limitation.
  comunidad: >-
    Digital Camera World describes a pleasant tactile finish and thumb support,
    but its reviewer found excessive wheel friction and awkward access to the
    upper control. Those are impressions from that review. If you scroll through
    long documents, check the wheel and whether you can press the controls
    without releasing your grip. Neither a vertical shape nor a positive review
    guarantees comfort.
