amazon:
  buscar: Anker A7852 AK-98ANWVM-UBA ratón vertical inalámbrico
webOficial: https://www.anker.com/ca/products/a7852
idealPara: Un solo equipo con USB-A y una mesa sin cable de ratón
veredicto: >-
  El Anker A7852 es un vertical sencillo para diestros, con receptor USB-A y dos
  pilas AAA no incluidas. Encaja si quieres prescindir del cable y no necesitas
  Bluetooth; en Mac pierdes las funciones de avance y retroceso.
resumenCompra:
  mejorPara: >-
    Trabajar habitualmente en un ordenador con puerto USB-A libre, con tres niveles
    de sensibilidad y pilas sustituibles en vez de una batería que haya que cargar.
  evitarSi: >-
    Necesitas Bluetooth, cambiar de equipo con un botón, usarlo por cable o
    disponer de avance y retroceso en Mac.
  alternativaDirecta: >-
    El Perixx PERIMICE-513 USB-A funciona y se alimenta por su cable de 1,8 m.
    Es la alternativa si prefieres dejar el ratón conectado y olvidarte de las pilas.
  decisionRapida: >-
    Comprueba primero el puerto de tu ordenador y que alcanzas la rueda y el
    control superior sin cambiar el agarre. Cuenta con comprar dos pilas AAA;
    si tu portátil solo tiene USB-C, necesitarás un adaptador o un hub compatible.
metodologia:
  - >-
    Revisamos las páginas oficiales de Anker y los análisis de Tom's Guide,
    Digital Camera World y HardwareZone, consultados el 3 de octubre de 2026.
    No hemos probado este ratón ni medido su autonomía, precisión o ruido.
  - >-
    Las funciones y la compatibilidad se basan en Anker. Las impresiones de
    agarre y rueda pertenecen a los autores de los análisis, no a una prueba
    propia ni a un ajuste garantizado para cualquier mano.
limitaciones:
  - >-
    La búsqueda comercial puede mostrar otros modelos. Comprueba la referencia
    A7852, también documentada como AK-98ANWVM-UBA, y la variante negra A7852011.
    Una foto parecida no confirma que un anuncio corresponda a esta versión.
  - >-
    El tramo económico es orientativo y se apoya en una consulta de Amazon.es del
    3 de octubre de 2026. No fija el precio ni garantiza existencias; comprueba
    las condiciones de la oferta que elijas, incluidos posibles requisitos Prime.
  - >-
    Anker publica compatibilidad con Windows, Linux y Mac OS X, pero advierte de
    que avance y retroceso no funcionan en Mac. No se promete que todas las
    funciones estén disponibles en cada versión del sistema.
  - >-
    Conservamos las medidas métricas corroboradas de 120 x 62,8 x 74,8 mm;
    otros campos oficiales en pulgadas discrepan. El peso queda sin dato
    confirmado para esta ficha.
  - >-
    No hay un límite numérico de tamaño de mano verificado ni una prueba propia
    de comodidad. Revisa las condiciones de devolución antes de comprar para
    poder comprobar el alcance de los controles con tu mano.
paraQuienSi:
  - >-
    Quien usa la mano derecha y quiere probar un agarre vertical sin añadir un
    cable a la zona donde mueve el ratón.
  - >-
    Quien trabaja con un solo ordenador y acepta que el receptor ocupe un puerto
    USB-A; para llevarlo a otro equipo tendrá que trasladar también el receptor.
  - >-
    Quien prefiere sustituir dos pilas AAA y valora poder guardar el receptor
    dentro del ratón al transportarlo.
paraQuienNo:
  - Quien busca un modelo para la mano izquierda o para compartir entre diestros y zurdos.
  - Quien necesita Bluetooth o alternar entre varios equipos sin mover el receptor.
  - Quien utiliza los botones de avance y retroceso como parte habitual de su trabajo en Mac.
  - Quien necesita botones programables con soporte confirmado o clics silenciosos documentados.
puntosFuertes:
  - >-
    Sensor óptico y conexión inalámbrica de 2,4 GHz mediante receptor USB-A,
    sin cable entre el ratón y el ordenador.
  - >-
    Tres ajustes de 800, 1200 y 1600 DPI. Permiten cambiar la sensibilidad desde
    el propio ratón; el valor más alto no implica por sí solo más precisión.
  - >-
    Clic izquierdo y derecho, clic de rueda y dos botones de avance y retroceso,
    además del control de DPI. Son funciones básicas, no una promesa de programación.
  - >-
    Hueco para guardar el receptor e interruptor en la base. Según Anker, entra
    en reposo tras ocho minutos sin uso y se reactiva con clic izquierdo o derecho.
puntosDebiles:
  - >-
    Necesita dos pilas AAA que no vienen incluidas; no tiene carga USB ni
    funcionamiento por cable. El tiempo hasta entrar en reposo no es una cifra
    de duración de las pilas.
  - >-
    Solo dispone de la conexión con receptor. Un portátil sin USB-A necesita
    resolver esa conexión, aunque el ratón sea inalámbrico.
  - >-
    Los botones laterales pierden avance y retroceso en Mac. Si son atajos que
    usas a diario, esta limitación pesa más que tenerlos físicamente.
comunidad: >-
  Digital Camera World describe un acabado agradable al tacto y apoyo para el
  pulgar, pero su autor encontró demasiada fricción en la rueda y difícil acceso
  al control superior. Son impresiones de esa prueba. Si recorres documentos
  largos, comprueba la rueda y si puedes pulsar los controles sin soltar el agarre;
  ni la forma vertical ni una reseña favorable garantizan comodidad.
