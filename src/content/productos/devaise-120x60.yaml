veredicto: "El DEVAISE 120x60 es de los elevables eléctricos más baratos que existen en Amazon.es: se ha visto por debajo de 80 euros con tablero ya ensamblado, algo que a este precio no siempre incluye la competencia. Por dentro es gama de entrada pura: un único motor, 70 kg de carga y un rango de 72 a 118 cm que cubre a la mayoría trabajando sentado y de pie, pero se queda justo para personas muy altas. Lo que sorprende para el precio es que trae panel con 3 memorias (72, 95 y 118 cm de fábrica, reprogramables) y anticolisión con retroceso de unos 2 cm, un extra de seguridad que muchos rivales de gama baja omiten. La estructura es de metal y aguanta bien, aunque en altura máxima tiembla más que un doble motor. No lo compres si vas a montar varios monitores pesados o subes y bajas el escritorio decenas de veces al día: para eso necesitas doble motor y más carga. Como primer elevable y por precio, es casi imbatible."
