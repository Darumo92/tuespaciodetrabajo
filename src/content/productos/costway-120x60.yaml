idealPara: "Quien quiere un escritorio elevable completo de precio contenido, con 4 memorias, puerto USB, anticolisión ajustable y ganchos, para un uso normal"
veredicto: "El Costway 120x60 es un elevable completo de gama media pensado para cubrir lo esencial sin complicarse: tablero incluido, panel con cuatro memorias, puerto USB, anticolisión regulable en varios niveles de sensibilidad y un par de ganchos para colgar cosas. Es de motor único —sube a unos 24 mm/s— pero con un rango generoso de 73 a 122 cm que da holgura tanto sentado como de pie, y aguanta 80 kg. Frente a los best-sellers de entrada (Devoko, SONGMICS), compite de tú a tú en equipamiento; frente a los de doble motor, cede en velocidad y firmeza. Costway lo vende tanto en su tienda como en Amazon, con varias medidas y colores. No es un escritorio para montajes pesados ni para subir y bajar todo el día, pero como completo equilibrado para teletrabajar, cumple sin sustos."
