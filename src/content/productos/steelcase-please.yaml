comunidad: "Steelcase es una de las marcas de referencia en mobiliario de oficina contract, con muy buena reputación de durabilidad. La Please se reconoce por su respaldo doble LTC2, una solución poco habitual: cada sección del respaldo sostiene una región distinta de la espalda. Al ser una silla de canal profesional y proyecto, las reseñas de usuario final son menos numerosas que en marcas de consumo, pero el consenso disponible la sitúa como una opción seria y longeva. Conviene recordar la garantía escalonada: estructura de por vida, 12 años en mecanismos y 5 años en tapicería."
