idealPara: "Oficina contract de gama alta para quien quiere que el respaldo sostenga lumbar y zona dorsal por separado"
veredicto: "La Steelcase Please gira en torno a su respaldo doble con mecanismo patentado LTC2: en lugar de un único panel, dos secciones independientes sostienen la zona lumbar y la dorsal por separado, así cada parte de la espalda recibe su propia tensión. A eso suma asiento de profundidad regulable y reposabrazos muy completos. El pero es el de toda silla contract Steelcase: es una compra cara con respaldo tapizado en espuma (no malla), y la garantía premia sobre todo la estructura, no cada componente por igual."
