veredicto: "La Fujin Pro es la apuesta seria de Razer por la silla ergonómica de malla completa, lejos del clásico asiento racing acolchado de la marca. Respaldo de malla transpirable, lumbar 2D, brazos 4D y reposacabezas 3D dan un nivel de ajuste muy alto para uso prolongado. El matiz importante está en la garantía: la estructura, los mecanismos y los reposabrazos llegan hasta 5 años, pero la malla y el asiento solo cubren hasta 1 año, así que la pieza que más se desgasta es la que menos cobertura tiene."
