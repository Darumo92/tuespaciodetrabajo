scoreRationale:
  ergonomia: "Malla completa con lumbar 2D y reposacabezas 3D pensados para sostener la postura muchas horas."
  ajustabilidad: "Lumbar en altura y profundidad, brazos 4D y cabezal 3D cubren casi todos los puntos de contacto."
  materiales: "Malla de elastómero termoplástico y poliéster sobre estructura de aluminio."
  comodidad: "Synchro-tilt con tensión regulable acompaña el cambio de postura entre trabajo y descanso."
  calidadPrecio: "Premium para una marca gaming, con la garantía de la malla como punto débil del paquete."
