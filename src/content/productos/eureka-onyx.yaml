veredicto: "La Onyx es la silla de malla más comedida de Eureka Ergonomic, una marca conocida por mobiliario gaming y de oficina con buena presencia en Amazon. Es una silla limpia y minimalista de respaldo entero de malla, con lumbar ajustable en altura, reposabrazos abatibles para guardarla bajo la mesa y un balanceo de 15 grados. No busca competir con las premium: soporta hasta 125 kg, está recomendada para estaturas en torno a 1,55 a 1,75 m y sus reposabrazos abatibles no son regulables en más ejes. Para teletrabajo y uso diario sin pretensiones, cumple con una relación calidad precio sensata."
