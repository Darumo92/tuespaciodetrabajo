en:
  nombreComercial: "HÅG Capisco 8106"
  veredicto: "The Capisco isn't a chair, it's a philosophy: a saddle seat, inBalance® tilting and full compatibility with sit-stand desks make it the best option for active work and dynamic posture. It needs real adaptation and doesn't give the passive comfort of a conventional chair, but for those who adopt it, it's irreplaceable."
  idealPara: "Sit-stand desk users, designers who alternate position and anyone who prefers active posture"
  comunidad: "A cult chair on r/OfficeChairs and among ergonomists. The consensus is clear: it's not for everyone, but anyone who works at a standing desk or seeks active posture doesn't go back. Creative Bloq (8/10) and remotehomesolutions.com highlight the flexibility and sturdy build; price and the adaptation curve are the only brakes."
  puntosFuertes:
    - "Saddle-style seat design: opens the hip angle and extends the spine"
    - "Compatible with standing desks: three cylinder heights available (up to 79 cm)"
    - "HÅG inBalance® system: smooth, balanced tilting mechanism"
    - "Height-adjustable backrest for lumbar support in multiple positions"
    - "Adjustable seat depth"
    - "10-year warranty"
  puntosDebiles:
    - "Maximum weight 110 kg, lower than other premiums"
    - "The saddle seat needs adaptation (weeks of postural adjustment)"
    - "No headrest as standard (optional)"
    - "High price (~€945 at the official store)"
    - "Not suited to anyone seeking passive reclining"
  paraQuienSi:
    - "Users with a height-adjustable desk who alternate sitting and standing"
    - "Designers, creatives and professionals who move a lot in the chair"
    - "People with lower-back issues seeking active posture"
    - "Anyone prioritising material quality and sustainability (50% recycled material)"
  paraQuienNo:
    - "Users looking to recline and rest passively"
    - "Anyone over 110 kg"
    - "People who need an integrated headrest as standard"
    - "Budgets below €900"
