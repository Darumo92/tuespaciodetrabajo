veredicto: "La VAOS.3 es la evolución de Quersus hacia un asiento y respaldo más anchos que la VAOS.2, pensada para acomodar un rango de alturas muy amplio, de 157 a 205 cm. Apuesta por la construcción europea: espuma fría de tres capas, mecanismo OPTIMUS SYNCHRON con bloqueo en cinco posiciones y sistema antichoque, lumbar LUMBFLEX ajustable en dos direcciones y reposabrazos 4D con almohadillas reemplazables. El respaldo es de polipiel sobre espuma, no de malla, así que transpira menos en verano, y su precio la sitúa en territorio alto. Para quien busca una gaming europea bien rematada con un lumbar regulable de verdad, es una opción a tener en cuenta."
