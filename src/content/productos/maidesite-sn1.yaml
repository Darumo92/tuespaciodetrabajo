veredicto: "El SN1 es el escritorio completo de gama media-baja de Maidesite: un doble motor silencioso (por debajo de 50 dB) que llega con tablero incluido y en tres tamaños (100x60, 120x60 y 140x70), para cubrir desde un rincón compacto hasta un setup de doble monitor. Frente a los elevables de entrada de un motor, gana en suavidad y en tener dos motores; frente al T2 Pro Plus de la casa, cede en carga (80 kg contra 160) y en garantía, pero cuesta bastante menos. Trae teclado táctil LED con cuatro memorias, carga USB, anticolisión y bloqueo infantil, lo que a este precio no es poco. No es una base para equipo pesado ni para trabajar de pie a mucha altura si mides bastante, pero como escritorio completo de doble motor para un uso normal, con 5 años de garantía, es una compra muy sensata."
