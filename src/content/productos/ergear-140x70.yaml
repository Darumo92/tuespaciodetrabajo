fuenteSpecs: "Specs del listado de Amazon.es para el ASIN B0FMQTKZKD (140x70 cm, altura 72-118 cm, carga 80 kg, ruido <50 dB, panel de 4 memorias, marco de acero), contrastadas con la reseña de entornoversatil.com (motor único, estabilidad en alturas medias, tablero en dos piezas, sin gestión de cables) y la ficha de tuescritorioelevable.es. Garantía de 5 años en la estructura (2 años en motor y componentes) según la política de garantía de ErGear; tablero de madera (aglomerado laminado en dos piezas). No se ha confirmado anticolisión, grosor de tablero, velocidad en mm/s, peso, segmentos de columna ni certificaciones, por lo que quedan en null."
