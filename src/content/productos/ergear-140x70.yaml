veredicto: "El ErGear 140x70 es de los escritorios elevables completos más baratos con buena nota real de usuarios. Motor único que aguanta 80 kg (más que muchos rivales de su precio), panel con 4 memorias y un tablero ya ensamblado que ahorra tiempo de montaje. El gancho lateral para mochila o auriculares es el tipo de detalle que no esperas a este precio. Lo que se resiente es el tablero, dividido en dos piezas que se notan al tacto y algo fino si apoyas mucho peso en el centro, y el ruido del motor, algo más presente que en marcas de gama media como FlexiSpot. Para un primer escritorio elevable sin complicarse, cumple con nota."
