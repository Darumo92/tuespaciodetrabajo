veredicto: "El FEZIBO 140x60 con cajones es un escritorio elevable completo que apuesta por el almacenamiento: viene con tablero, dos cajones bajo la superficie y un soporte para monitor incluido, algo poco común a este precio. El motor es único y sube a unos 30 mm/s, con anticolisión y panel de tres memorias, y aguanta 80 kg sobre un bastidor de acero. No es el más rápido ni el más silencioso —los motores simples de esta gama se quedan por debajo de los dobles—, y el fondo de 60 cm se queda algo justo con un monitor grande y teclado, pero el conjunto cunde: tener cajones y soporte de monitor de fábrica ahorra comprarlos aparte. Para un puesto ordenado en casa, con todo incluido y sin sumar accesorios, es una compra redonda dentro de su precio."
