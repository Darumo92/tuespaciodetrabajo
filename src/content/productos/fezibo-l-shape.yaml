idealPara: "Quien tiene una esquina que aprovechar y quiere un elevable grande en forma de L, completo y con doble motor, para trabajar con mucha superficie"
veredicto: "El FEZIBO en forma de L es la respuesta a un problema que las estructuras rectas no resuelven: aprovechar una esquina con mucha superficie de trabajo y, además, que suba y baje. Es un escritorio completo de doble motor, con tablero en L reversible (se monta a izquierda o derecha), tres memorias, anticolisión, ganchos para colgar cosas y bandeja de gestión de cables. Aguanta 80 kg y sube de unos 67,5 a 115,5 cm. Su ventaja es única en el catálogo —forma de L y tamaño grande— pero hay que asumir sus límites: la carga es de gama media y, al ser una superficie tan grande, el montaje es más laborioso que el de un escritorio recto. FEZIBO también tiene versiones de triple motor con más carga (hasta 150 kg) si necesitas más. Para una esquina de home office con doble monitor y sitio para todo, es de lo más práctico."
