veredicto: "La RH Logic 400 es una silla escandinava de gama contract construida alrededor de la filosofía 2PP de postura y movimiento, es decir, sentado activo en lugar de pasivo. Su respaldo alto tapizado en espuma, el lumbar ajustable en altura y una resistencia de inclinación que se regula al peso y la altura del usuario buscan que la espalda trabaje en lugar de quedar inmóvil. Suma certificaciones serias (EN 1335, NPR 1813, Möbelfakta, GREENGUARD GOLD, Nordic Swan) que la avalan tanto en ergonomía como en sostenibilidad. Es una compra de tramo premium pensada para quien quiere una silla de proyecto duradera más que un capricho estético."
