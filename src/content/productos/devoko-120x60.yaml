idealPara: "Quien quiere estrenarse en los escritorios elevables gastando lo mínimo, con tablero incluido y sin renunciar a la anticolisión con retroceso"
veredicto: "El Devoko 120x60 es la puerta de entrada más barata a la categoría: un escritorio elevable completo, con tablero incluido, por unos 114 euros —menos de lo que cuesta solo la estructura de gama alta—. A cambio se nota que es gama básica: un único motor que sube despacio (20 mm/s), 70 kg de carga y un rango de 73 a 118 cm que cubre bien a la mayoría pero se queda corto para personas muy altas de pie. Lo que sí trae, y no siempre está en este precio, es panel con 2 memorias y anticolisión con retroceso automático. Con miles de valoraciones y una media alta en Amazon, es el best-seller de la gama de entrada por una razón: cumple para un home office normal. No lo compres si vas a subir y bajar el escritorio muchas veces al día o piensas cargarlo con varios monitores y equipo pesado: para eso necesitas doble motor. Como primer elevable y por precio, es imbatible."
