veredicto: "La Zody destaca por su sistema lumbar PAL, que permite regular cada lado de la espalda de forma independiente, algo poco común incluso en gama premium. Con reposabrazos 4D y respaldo de malla por zonas, queda como una de las sillas más completas para problemas de espalda; su precio premium y la necesidad de configurarla bien son sus principales frenos."
