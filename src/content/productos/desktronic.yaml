veredicto: "El Desktronic es una estructura elevable de doble motor que juega la carta del acabado: pantalla táctil con tres memorias, puertos de carga USB y USB-C integrados y un marco de acero con conectores de columna reforzados que la marca dice probados 100.000 veces. Sube y baja sin el tambaleo típico de las estructuras baratas, aguanta 80 kg y cubre un rango de unos 72 a 118 cm. Frente a los marcos de doble motor más básicos, gana en electrónica y en la sensación de calidad; frente a la gama alta de FlexiSpot o Maidesite, se queda por debajo en carga y en garantía documentada. Como el resto de estructuras, se vende sin tablero, así que hay que sumar ese gasto. Es una buena base de doble motor para quien valora la pantalla táctil y los USB integrados sin irse a la gama premium."
