en:
  nombreComercial: "Steelcase Series 1"
  veredicto: "The Series 1 is the entry point to the Steelcase ecosystem: a flexible mesh back, adjustable lumbar support and up to 4D armrests depending on configuration, with the same 12-year warranty as the high-end range. It doesn't match the fine-tuned adjustment of a Leap, but it delivers serious office-grade durability at a much more accessible price."
  idealPara: "Anyone who wants Steelcase ergonomics and warranty without paying Leap or Gesture money"
  comunidad: "Reviews such as SeatedLab and TechGearLab rank it among the best accessible-premium buys: genuine office-grade construction and a long warranty, with the usual criticism that the seat padding is somewhat firm and that the premium options (4D arms, lumbar) push up the configured price."
  puntosFuertes:
    - "12-year warranty inherited from Steelcase's high-end range"
    - "Flexible mesh back with adjustable lumbar support"
    - "Adjustable seat depth"
    - "Up to 4D armrests depending on configuration"
    - "Supports up to 181 kg"
  puntosDebiles:
    - "Premium options (4D arms, lumbar) raise the configured price"
    - "Seat padding firmer than average"
    - "No headrest in the base configuration"
  paraQuienSi:
    - "Buyers wanting office-brand warranty and durability at a mid-range price"
    - "Users who value a breathable mesh back with adjustable lumbar"
    - "Long work days where reliability matters more than luxury"
  paraQuienNo:
    - "Anyone wanting the fine synchronized adjustment of a Leap V2 or Gesture"
    - "Budgets below the mid-range"
    - "Anyone who prefers a very plush seat"
