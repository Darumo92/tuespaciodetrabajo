idealPara: "Quien quiere el escritorio elevable definitivo para gaming o setup con muchos cables, con tablero metálico y el mejor sistema de gestión de cables magnético del mercado"
veredicto: "El MAGNUS Pro es la apuesta de Secretlab por el escritorio elevable 'definitivo', y su gran baza no es la carga ni la velocidad, sino resolver el caos de cables como nadie: tablero de acero magnético, canaleta oculta bajo el tablero y un ecosistema de accesorios magnéticos (MAGPAD de cuero sintético, soportes, hub) que se enganchan sin tornillos. Es de doble motor silencioso (<50 dB), sube de 65 a 125 cm, aguanta 120 kg y se controla desde un panel táctil integrado en el borde con tres perfiles. La construcción de acero es de las más robustas del mercado y el acabado, impecable. Los peros son dos: el precio, de los más altos de la categoría, y que la superficie metálica exige el MAGPAD o una alfombrilla para escribir cómodo. Nota: en 2025 Secretlab lanzó el MAGNUS Evo como sucesor, así que conviene comparar disponibilidad. Para un setup gaming o de creador con muchos periféricos, sigue siendo la referencia en gestión de cables."
