en:
  nombreComercial: "COLAMY ATLAS High Back"
  veredicto: "COLAMY's ATLAS is a high-back mesh chair with a notable set of adjustments for its price: 4D armrests, an adjustable headrest that also rotates, a sliding-depth seat and four recline-lock positions. It adds an aluminium base, BIFMA certification and a three-year warranty. It's a very balanced mid-range buy, with mesh treated to the OEKO-TEX standard. Its load capacity, around 136 kg, sits at the average."
  idealPara: "Anyone wanting a high mesh backrest with 4D armrests and BIFMA certification at a good price"
  comunidad: "The consensus rates the ATLAS as a very complete mesh chair for its price, with a good aluminium base, 4D armrests and the reassurance of BIFMA certification. The usual caveats are that the lumbar is adjustable but not self-adjusting and that the load capacity sits at the average."
  resumenCompra:
    mejorPara: "Anyone wanting a high mesh backrest, 4D armrests and BIFMA certification without paying a premium price."
    evitarSi: "You need a very high load capacity or a padded foam seat."
    alternativaDirecta: "Hbada E3 Pro if you want even more lumbar and headrest adjustments."
    decisionRapida: "A very complete, certified mid-range chair, easy to recommend for home-office work."
