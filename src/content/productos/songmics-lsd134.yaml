veredicto: "El SONGMICS LSD134 es, con diferencia, uno de los escritorios elevables más vendidos de Amazon.es: acumula miles de valoraciones con una media alta (en torno a 4,5 estrellas sobre más de 3.000 reseñas) y es la referencia de la marca en 140x60 cm. La fórmula es la de la gama de entrada bien hecha: motor único que sube de 72 a 120 cm de forma silenciosa (por debajo de 48 dB), tablero de 140 cm incluido —más superficie que el habitual 120x60 por poco más—, panel con 4 memorias, puerto USB-C para cargar, y organizador de cables con ganchos. Los 70 kg de carga y el motor único son su techo: no está pensado para alternar sentado-de pie decenas de veces al día ni para montajes de varios monitores pesados. Pero como primer elevable amplio, con USB-C y de una marca contrastada por volumen de ventas, es de las apuestas más seguras de la gama baja. Si dudas entre este y el LSD132, la diferencia es el tamaño: el 134 es el de 140 cm; el 132, el de 120 cm."
