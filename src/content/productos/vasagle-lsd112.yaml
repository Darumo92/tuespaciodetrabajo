idealPara: "Quien busca un elevable de gama de entrada con diseño industrial cuidado, enchufe y cajón integrados y 4 memorias, sin pasar de un motor único"
veredicto: "VASAGLE es la marca de mobiliario de SONGMICS, y el LSD112 es uno de sus elevables más vendidos en Amazon.es por una mezcla difícil de batir: diseño industrial (marrón rústico, roble, blanco…), 4 memorias, enchufe y cajón integrados, y un precio que ronda los 110-125 euros con el tablero incluido. Es gama de entrada honesta: un único motor a 25 mm/s —lento pero silencioso, por debajo de 50 dB—, 80 kg de carga y un rango de 72 a 120 cm que cubre de sentado a de pie a la mayoría. Frente al Devoko o el DEVAISE, el LSD112 sube algo la apuesta con 4 memorias en vez de 2-3, más carga (80 kg) y detalles de acabado que se notan, además del enchufe y el cajón que muchos rivales no traen. Lo que no cambia es la limitación del motor único: si vas a alternar sentado-de pie muchas veces al día o cargar varios monitores pesados, un doble motor te dará más soltura y estabilidad en altura. Como primer elevable con buen diseño y extras, es de los más equilibrados de la gama baja."
