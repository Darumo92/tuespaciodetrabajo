veredicto: "La Kaiser 3 es de las gaming acolchadas mejor valoradas de su gama: ofrece reposabrazos 4D con superficies magnéticas intercambiables, lumbar integrado de 4 vías y un asiento amplio que sienta bien a usuarios grandes, sobre todo en la versión XL que aguanta hasta 180 kg. La construcción con base de aluminio en la XL transmite solidez y la garantía de cinco años da tranquilidad. El pero es el de casi todas las gaming de cuero: el respaldo no transpira como una malla y el cojín lumbar es firme al principio. Si buscas una gaming robusta y bien rematada sin entrar en precios de oficina premium, cumple de sobra."
