veredicto: "El E7Q Odin es la bestia de carga de FlexiSpot: en lugar de las dos patas habituales, monta cuatro columnas en U de tres tramos con cuatro motores y acero al carbono, para ofrecer la base más estable y con más capacidad de la marca. Elimina el tambaleo que arrastran todos los elevables de dos patas y aguanta hasta 200 kg (según configuración, incluso más), con un rango de 68 a 133 cm y una subida de unos 38 mm/s pese al tamaño. Está pensado para tableros grandes, mesas en L o setups de varios monitores y equipo pesado que las estructuras de dos patas no cubren con la misma firmeza. El precio es su gran pero: es de lo más caro de la categoría y, como el resto de la gama, se vende como estructura sin tablero. Si necesitas una base a prueba de todo para una superficie grande, no hay mucho que se le acerque."
