idealPara: "Quien quiere un elevable barato sin depender de un enchufe ni de la electrónica, con manivela manual y estructura de acero para poner su propio tablero"
veredicto: "El Duronic TM00 es la rareza útil del catálogo: un escritorio elevable manual, de manivela, sin motor ni electrónica que se pueda estropear. Es la opción para quien no quiere cables, no tiene un enchufe cerca o simplemente busca lo más barato y sencillo. Sube de 71 a 116 cm girando la manivela, aguanta 60 kg y la estructura de acero se extiende de 108 a 187 cm para adaptarse a casi cualquier tablero (que se compra aparte, porque se vende solo el marco). A cambio de ese precio bajo y esa fiabilidad de 'no hay nada que falle', renuncias a todo lo cómodo: no hay memorias, ni subida rápida, ni anticolisión, y cambiar de sentado a de pie cuesta girar unas cuantas vueltas. Si vas a alternar postura muchas veces al día, un eléctrico te compensará; pero como base barata, robusta y a prueba de averías para un tablero propio, el TM00 tiene su hueco. Duronic también vende versiones eléctricas (TM12, TM22, TM51) si prefieres motor."
