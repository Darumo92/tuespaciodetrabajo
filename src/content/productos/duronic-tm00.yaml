en:
  nombreComercial: "Duronic TM00 Manual Height-Adjustable Desk Frame (frame only)"
  tituloCorto: "Duronic TM00"
  veredicto: "The Duronic TM00 is the catalog's useful oddity: a manual, crank-operated standing desk with no motor or electronics to break. It's the choice for anyone who doesn't want cables, has no outlet nearby, or simply wants the cheapest, simplest option. It rises from 71 to 116 cm by turning the crank, holds 60 kg, and the steel frame extends from 108 to 187 cm to fit almost any tabletop (bought separately, since only the frame is sold). In exchange for that low price and 'nothing to fail' reliability, you give up everything convenient: no memories, no fast rise, no anti-collision, and switching from sitting to standing takes a few turns of the crank. If you'll change posture many times a day, an electric one is worth it; but as a cheap, sturdy, failure-proof base for your own tabletop, the TM00 has its place. Duronic also sells electric versions (TM12, TM22, TM51) if you prefer a motor."
  idealPara: "Anyone who wants a cheap standing desk without relying on an outlet or electronics, with a manual crank and a steel frame for their own tabletop"
  comunidad: "Reviews value the sturdiness of the steel frame, how reliable it is without a motor, and the low price, plus the convenience of not needing an outlet. Criticisms are the expected ones for a manual: cranking gets tiring if you change posture often, and you have to buy the top separately. For anyone after simplicity and durability, it delivers."
  resumenCompra:
    mejorPara: "A cheap, sturdy, electronics-free standing desk, with a manual crank and a frame for your own tabletop."
    evitarSi: "You'll switch sit-stand many times a day: cranking each time gets tiring; go electric instead."
    alternativaDirecta: "Duronic TM22/TM51 for the same brand but with a motor; Devoko 120x60 for a cheap complete electric desk with tabletop included."
    decisionRapida: "The simplest, cheapest manual standing desk with nothing to break; the catch is cranking the handle and buying the top separately."
  puntosFuertes:
    - "Manual: no motor or electronics to fail, very reliable"
    - "No outlet needed: place it anywhere"
    - "Extendable steel frame (108-187 cm) for almost any tabletop"
    - "Very low price"
  puntosDebiles:
    - "Changing height means cranking the handle (slow and awkward)"
    - "Sold without a tabletop: separate cost"
    - "Load limited to 60 kg and no electronic features"
  paraQuienSi:
    - "Anyone who wants a cheap standing desk with no electronics to break"
    - "Anyone with no nearby outlet or who wants no cables"
    - "Anyone putting their own tabletop on the frame"
  paraQuienNo:
