veredicto: "La Markus es la silla de oficina de referencia en su precio: respaldo alto de malla, lumbar integrado, base de aluminio certificada y 10 años de garantía por ~159 €. Los ajustes son mínimos (solo altura de asiento e inclinación), pero para ese precio es simplemente imbatible como primera silla de home office."
resumenCompra:
  mejorPara: "Primera silla de home office, estudiantes y uso moderado con presupuesto ajustado."
  evitarSi: "Necesitas soporte lumbar ajustable, reposabrazos regulables o trabajas sentado más de 8 horas al día."
  alternativaDirecta: "SIHOO Doro C300 si quieres salto claro en ergonomía y ajustes."
  decisionRapida: "La elegiría como compra de entrada por garantía y precio, no como solución ergonómica avanzada."
metodologia:
  - "Se han priorizado garantía, disponibilidad, specs oficiales y limitaciones de ajuste."
  - "La valoración compara la MARKUS contra otras sillas de entrada, no contra modelos premium."
  - "La ficha penaliza el lumbar fijo y la falta de ajustes críticos aunque mantenga una nota alta en calidad-precio."
scoreRationale:
  ergonomia: "Correcta para uso moderado, limitada por lumbar fijo y pocos ajustes."
  ajustabilidad: "Solo cubre altura e inclinación básica frente a rivales con brazos y asiento regulables."
  materiales: "La base de aluminio y garantía de 10 años mejoran su posición en gama de entrada."
  comodidad: "Asiento espacioso y respaldo alto, pero no universal por el lumbar fijo."
  calidadPrecio: "Su punto más fuerte: mucha silla útil por un presupuesto bajo."
