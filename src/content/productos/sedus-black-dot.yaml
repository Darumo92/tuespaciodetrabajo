comunidad: "Sedus es un fabricante alemán de referencia en mobiliario de oficina contract, con muy buena reputación de durabilidad y calidad de fabricación en entornos profesionales europeos. La black dot se valora por su mecanismo dorsocinético y su construcción, aunque las reseñas de usuario final son menos numerosas que en marcas de consumo, ya que su canal principal es el de proyecto y empresa. El consenso disponible la sitúa como una silla seria y longeva, con el precio como principal barrera."
