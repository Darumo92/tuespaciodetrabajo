veredicto: "La Sedus black dot es una silla de oficina alemana de gama contract cuya seña de identidad es el mecanismo dorsocinético patentado: el respaldo va unido por una articulación flexible que cede 15 grados hacia atrás y 8 grados lateralmente, acompañando el movimiento natural del tronco. A eso suma el mecanismo Sedo-Lift III de elevación del asiento con suspensión, una construcción muy seria y certificación EN 1335-1:2023 Tipo A, entre otras (GS, GREENGUARD, AGR, Blue Angel). El modelo tapizado estándar lleva lumbar fijo; existe la variante black dot net de membrana de malla que añade lumbar ajustable en altura. Es una compra premium que se justifica por durabilidad y garantía más que por número de ajustes."
