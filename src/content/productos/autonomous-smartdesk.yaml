en:
  nombreComercial: "Autonomous SmartDesk Core Dual-Motor Electric Standing Desk"
  tituloCorto: "Autonomous SmartDesk Core"
  veredicto: "The SmartDesk Core is Autonomous's best-selling standing desk —one of the reference brands in the standing-desk world— and its reputation comes from a very solid balance: a dual motor among the quietest on the market (under 45 dB), 113 kg of load —high for a complete desk— and a four-memory panel, all at a contained price for what it offers. It arrives complete, with a tabletop, and rises from about 72 to 121 cm, a fine range though not among the widest for very tall people. Its big draw is how quiet it is and the brand's reputation for durability; the catch is that it's bought from Autonomous's own store (not Amazon.es), with the lead times and shipping that entails, and that the height range runs a bit short up top. There's also the SmartDesk Pro, with more range and a 7-year frame warranty. As a quiet dual-motor complete desk from a well-known brand, it's a benchmark."
  idealPara: "Anyone who wants a complete dual-motor desk from a reference international brand, very quiet and with high load, bought from the official store"
  comunidad: "Lab-tested international reviews highlight how quiet it is —one you don't hear— and Autonomous's reputation for durability, plus high load for a complete desk. Criticisms are the height range, a bit short up top, and the logistics of buying from the official store. As a complete dual-motor desk from a well-known brand, the rating is very good."
  resumenCompra:
    mejorPara: "A very quiet, high-load dual-motor complete desk from a reference international brand."
    evitarSi: "You're quite tall and need lots of standing range, or you want to buy on Amazon.es with fast shipping."
    alternativaDirecta: "Autonomous SmartDesk Pro for more range and a 7-year warranty; Maidesite T2 Pro Plus for load and price on Amazon.es."
    decisionRapida: "Autonomous's quietest dual-motor complete desk, with 113 kg load; the catch is the tight upper range and buying from the official store."
  puntosFuertes:
    - "Dual motor among the quietest on the market (<45 dB)"
    - "High 113 kg load for a complete desk"
    - "4-memory panel and reputation for durability"
    - "Reference international standing-desk brand"
  puntosDebiles:
    - "Bought from the official store, not Amazon.es"
    - "Height range a bit short up top"
    - "Speed, weight, and top thickness not published"
  paraQuienSi:
    - "Anyone who wants a very quiet dual-motor complete desk"
    - "Anyone who values an international brand's reputation and durability"
    - "Anyone who needs high load (113 kg) for several monitors"
  paraQuienNo:
