veredicto: "El SmartDesk Core es el elevable más vendido de Autonomous, una de las marcas de referencia en el mundo del standing desk, y su fama viene de un equilibrio muy sólido: doble motor de los más silenciosos del mercado (por debajo de 45 dB), 113 kg de carga —alta para un completo— y un panel con cuatro memorias, todo por un precio contenido para lo que ofrece. Llega completo, con tablero incluido, y sube de unos 72 a 121 cm, un rango correcto aunque no de los más amplios para personas muy altas. Su gran baza es lo callado que es y la reputación de durabilidad de la marca; el pero, que se compra en la tienda oficial de Autonomous (no en Amazon.es), con los tiempos y gastos de envío que eso supone, y que el rango de altura se queda algo corto arriba. Existe también el SmartDesk Pro, con más rango y garantía de 7 años en la estructura. Como completo de doble motor silencioso de marca reconocida, es una referencia."
