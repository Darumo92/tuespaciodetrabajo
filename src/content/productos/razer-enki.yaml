veredicto: "La Enki es la apuesta de Razer por la comodidad de jornada larga: su asiento ultra ancho de 540 mm y los arcos de hombro extendidos a 110 grados reparten bien el peso y dejan moverse sin sentir los laterales clavándose. Lleva lumbar incorporado en el respaldo (en arco, no regulable por separado), cojín cervical de memoria y certificaciones BIFMA x5.1 y EN 1335-2, que no son habituales en una gaming. El reclinable llega hasta 152 grados y los reposabrazos se ajustan en altura, lateral y separación, aunque no son 4D completos. Para quien valora comodidad amplia y respaldo certificado, es una gaming sólida; quien quiera el máximo ajuste de reposabrazos o malla mirará otras."
