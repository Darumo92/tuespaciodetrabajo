idealPara: Combinar poco peso, conexión por cable y varios dispositivos Bluetooth
veredicto: >-
  Los 78 g y la conexión de datos por USB son las razones más claras para
  considerar este Keychron M6 en un escritorio de trabajo. También admite
  2,4 GHz y Bluetooth con tres dispositivos. Esta ficha corresponde al M6-A1
  negro de 1.000 Hz con interruptores Clicky: verifica la edición, porque las
  versiones Premium tienen otras especificaciones.
resumenCompra:
  mejorPara: >-
    Quien quiere un ratón ligero con batería recargable y poder alternar entre
    conexión por cable, 2,4 GHz y Bluetooth según el equipo.
  evitarSi: >-
    Necesitas clics silenciosos, medidas confirmadas para decidir el agarre o
    una oferta cuya disponibilidad ya esté verificada.
  alternativaDirecta: >-
    El Logitech M720 Triathlon permite cambiar entre tres dispositivos y usa
    una pila AA. Sus medidas están publicadas y pesa 135 g con pila, frente a
    los 78 g del M6. En el M720 no tenemos confirmados los datos por USB.
  decisionRapida: >-
    Busca la referencia M6-A1 y la combinación Standard Wheel, PixArt 3395,
    1K y Clicky. Confirma existencias y contenido de caja antes de pagar.
    Si el tamaño decide la compra, pide las medidas de esa variante: aquí
    siguen sin verificar.
metodologia:
  - >-
    Análisis documental de las páginas oficiales global y española y sus datos
    de variante, consultados el 12 de octubre de 2026. No hemos probado este
    ratón ni medido autonomía, comodidad, ruido o respuesta del sensor.
  - >-
    Documentamos el M6-A1 negro Standard Wheel, PixArt 3395, 1K y Clicky Micro
    Switch. La variante global es 40664466849881 y la española 44551411237030.
    No trasladamos a esta edición peso, Bluetooth ni autonomía de las Premium.
  - >-
    El tramo de precio es una banda editorial relativa al catálogo, apoyada
    en la consulta de la tienda oficial española. No equivale a un importe
    vigente ni a una oferta de Amazon; la variante española figuraba agotada.
limitaciones:
  - >-
    La variante M6-A1 de la tienda oficial española figuraba agotada el 12 de
    octubre de 2026. La ficha técnica no demuestra que puedas comprarla ahora.
    Comprueba existencias en la tienda elegida y que venda esa misma edición.
  - >-
    No hemos confirmado dimensiones, capacidad de batería ni contenido de caja
    de esta variante. La conexión de 2,4 GHz no confirma por sí sola qué receptor
    o accesorios incluye una oferta.
  - >-
    Keychron anuncia hasta 80 horas de autonomía. Es una cifra del fabricante,
    no una medición nuestra. No la confundas con las 180 horas anunciadas para
    otras ediciones; tampoco corresponden aquí los 86 g ni Bluetooth 5.3.
  - >-
    Esta edición usa interruptores Clicky, no silenciosos. No hemos medido el
    ruido: el nombre del interruptor no permite cuantificarlo ni valorar cómo
    se oirá en tu despacho.
  - >-
    El cambio entre los tres dispositivos Bluetooth se hace desde la base.
    Eso exige acceder a la parte inferior cuando cambias de equipo; no implica
    un salto automático entre ordenadores.
  - >-
    La búsqueda de Amazon incluye la referencia y la edición, pero sus
    resultados pueden mezclar modelos. No tenemos ASIN ni oferta verificados.
    Comprueba referencia, vendedor, precio, existencias y accesorios.
paraQuienSi:
  - Quien prioriza un peso publicado de 78 g y batería recargable.
  - Quien necesita transmisión de datos por USB además de conexión inalámbrica.
  - Quien alterna entre tres dispositivos Bluetooth y acepta cambiar desde la base.
paraQuienNo:
  - Quien necesita clics silenciosos para compartir despacho.
  - Quien solo comprará con dimensiones y contenido de caja ya confirmados.
  - Quien necesita una oferta disponible y verificada antes de elegir modelo.
puntosFuertes:
  - Peso publicado de 78 g, menor que los 135 g con pila del M720 Triathlon.
  - >-
    Conexión de datos por USB, 2,4 GHz y Bluetooth 5.1. Puedes elegir cable
    cuando necesites esa conexión, sin limitar el USB a cargar la batería.
  - Bluetooth con cambio manual entre tres dispositivos desde la base.
  - >-
    Sensor PixArt 3395 con hasta 26.000 DPI y tasa de sondeo de 1.000 Hz por
    2,4 GHz o USB. Son máximos publicados, no una prueba de precisión o una
    necesidad para trabajar con documentos.
  - Batería recargable con hasta 80 horas anunciadas para esta edición.
puntosDebiles:
  - La edición Clicky no sirve si tu requisito son clics silenciosos.
  - Medidas, capacidad de batería y contenido de caja pendientes de confirmar.
  - Cambiar de dispositivo Bluetooth requiere acceder al selector de la base.
  - La variante oficial española estaba agotada al consultar; falta una oferta verificada.
comunidad: >-
  No hemos incorporado reseñas de compradores ni pruebas independientes de esta
  variante. La comparación se apoya en datos oficiales, no en un consenso sobre
  comodidad, fiabilidad o sensor. Comprueba el agarre y el alcance de los botones;
  ni los 78 g ni el máximo de DPI permiten resolver esas dudas por sí solos.
