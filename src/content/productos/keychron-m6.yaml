en:
  nombreComercial: Keychron M6 (M6-A1, 1K Clicky)
  tituloCorto: Keychron M6
  idealPara: Combining low weight, wired data and several Bluetooth devices
  veredicto: >-
    The 78 g weight and USB data connection are the clearest reasons to consider
    this Keychron M6 for desk work. It also supports 2.4 GHz and Bluetooth with
    three devices. This profile covers the black M6-A1 at 1,000 Hz with Clicky
    switches: check the edition, as Premium versions have different specifications.
  resumenCompra:
    mejorPara: >-
      People wanting a lightweight, rechargeable mouse and the choice of wired,
      2.4 GHz or Bluetooth operation depending on the computer.
    evitarSi: >-
      You need quiet clicks, confirmed dimensions to assess your grip or an
      offer with verified availability.
    alternativaDirecta: >-
      The Logitech M720 Triathlon switches between three devices and uses an
      AA battery. Its dimensions are published and it weighs 135 g with the
      battery, compared with the M6's 78 g. USB data remains unconfirmed for
      the M720.
    decisionRapida: >-
      Look for M6-A1 and the Standard Wheel, PixArt 3395, 1K and Clicky combination.
      Confirm stock and box contents before buying. If size decides your choice,
      ask for the dimensions of that variant: they remain unverified here.
  metodologia:
    - >-
      Documentary analysis of the global and Spanish official pages and their
      variant data, consulted on 12 October 2026. We have not tested this mouse
      or measured battery life, comfort, noise or sensor response.
    - >-
      We document the black M6-A1 with Standard Wheel, PixArt 3395, 1K and Clicky
      Micro Switch. The global variant is 40664466849881 and the Spanish variant
      is 44551411237030. Premium weight, Bluetooth and battery life specifications
      do not apply to this edition.
    - >-
      The price tier is an editorial band relative to this catalog, informed
      by the Spanish official store check. It is not a current price or Amazon
      offer and does not establish a US price. The Spanish variant was sold out.
  limitaciones:
    - >-
      The M6-A1 variant in the Spanish official store was sold out on 12 October
      2026. Technical specifications do not establish current availability.
      Check stock at your chosen store and confirm that it sells this edition.
    - >-
      Dimensions, battery capacity and box contents remain unconfirmed for this
      variant. Support for 2.4 GHz does not by itself establish which receiver
      or accessories an offer includes.
    - >-
      Keychron advertises up to 80 hours of battery life. That is a manufacturer
      figure, not our measurement. Do not confuse it with the 180 hours advertised
      for other editions; the 86 g weight and Bluetooth 5.3 also do not apply here.
    - >-
      This edition uses Clicky switches, not quiet switches. We have not measured
      noise: the switch name does not quantify it or establish how it will sound
      in your workspace.
    - >-
      Switching between the three Bluetooth devices uses the underside selector.
      You need access to the base when changing computers; this is not automatic
      movement between them.
    - >-
      The Amazon search includes the reference and edition, but results may mix
      models. We have no verified ASIN or offer. Check the reference, seller,
      price, stock and accessories. Amazon US availability and a OneLink
      destination have not been verified.
  paraQuienSi:
    - People prioritizing a published 78 g weight and a rechargeable battery.
    - People needing USB data operation as well as wireless connectivity.
    - People switching between three Bluetooth devices who accept an underside selector.
  paraQuienNo:
    - People requiring quiet clicks for a shared workspace.
    - People buying only with confirmed dimensions and box contents.
    - People requiring an available, verified offer before choosing a model.
  puntosFuertes:
    - Published 78 g weight, lower than the M720 Triathlon's 135 g with battery.
    - >-
      USB data, 2.4 GHz and Bluetooth 5.1 connections. You can choose wired
      operation when needed, without restricting USB to battery charging.
    - Bluetooth with manual switching between three devices from the base.
    - >-
      PixArt 3395 sensor with up to 26,000 DPI and a 1,000 Hz polling rate over
      2.4 GHz or USB. These are published maximums, not a precision test or
      a requirement for document work.
    - Rechargeable battery with up to 80 hours advertised for this edition.
  puntosDebiles:
    - The Clicky edition does not meet a requirement for quiet clicks.
    - Dimensions, battery capacity and box contents remain unconfirmed.
    - Changing Bluetooth devices requires access to the underside selector.
    - The Spanish official variant was sold out when checked; a verified offer is missing.
  comunidad: >-
    We have not included buyer reviews or independent testing of this variant.
    Comparison rests on official specifications, not a consensus about comfort,
    reliability or the sensor. Check your grip and button reach; neither the
    78 g weight nor the maximum DPI resolves those questions by itself.
