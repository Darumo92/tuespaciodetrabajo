en:
  nombreComercial: Logitech MX Master 4
  idealPara: Long documents, spreadsheets and configurable application shortcuts
  veredicto: The Logitech MX Master 4 combines a thumb wheel, MagSpeed and haptic shortcuts. Weigh its 150 g body and software requirements before choosing it.
  resumenCompra:
    mejorPara: Horizontal scrolling and custom application actions on Windows or macOS.
    evitarSi: Low weight matters most, you are left-handed, or your work computer blocks software installation.
    alternativaDirecta: The M650 covers simpler office tasks; the MAYA X prioritizes low weight over extra wheels and shortcuts.
  metodologia:
    - Based on Logitech's specifications, box contents and software requirements. The standard black variant was checked on Amazon Spain on 17 September 2026.
    - I have not tested this model. Manufacturer productivity percentages are not presented as a promise of personal performance.
  limitaciones:
    - Advanced Options+ features depend on the operating system and application; check your work computer's software policy.
    - Logitech lists a USB-C Bolt receiver but no charging cable in the standard package. The Mac edition is a separate variant.
  paraQuienSi:
    - Spreadsheet and editor users who benefit from a dedicated horizontal wheel.
    - People switching between up to three devices who can configure Options+.
  paraQuienNo:
    - Anyone seeking a lightweight mouse for fingertip movements.
    - Users who only need basic clicking, scrolling and navigation.
    - Left-handed users.
  puntosFuertes:
    - MagSpeed scroll wheel and dedicated horizontal thumb wheel.
    - Actions Ring and configurable haptic feedback in supported features.
    - Bluetooth, Bolt support and three-device switching.
    - USB-C rechargeable battery.
  puntosDebiles:
    - At 150 g, it is heavier than the other mice in this batch.
    - Much of its appeal depends on software and supported applications.
    - Logitech lists no charging cable in the standard package.
