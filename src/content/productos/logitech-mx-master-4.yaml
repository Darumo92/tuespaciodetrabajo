resumenCompra:
  mejorPara: Quien utiliza desplazamiento horizontal y quiere configurar acciones de sus aplicaciones en Windows o macOS.
  evitarSi: Priorizas poco peso, eres zurdo o no puedes instalar software en el equipo de empresa.
  alternativaDirecta: El M650 cubre un uso de oficina más sencillo; el MAYA X prioriza ligereza frente a ruedas y atajos.
metodologia:
  - Análisis de especificaciones, contenido de caja y requisitos de software publicados por Logitech. Variante estándar negra verificada en Amazon.es el 17 de septiembre de 2026.
