limitaciones:
  - Las funciones avanzadas de Options+ dependen del sistema operativo y de la aplicación; comprueba los permisos de tu ordenador de empresa.
  - Logitech incluye receptor USB-C Bolt en la versión estándar, pero no cable de carga. La edición para Mac es otra variante.
paraQuienSi:
  - Usuarios de hojas de cálculo o editores que aprovechan una rueda horizontal dedicada.
  - Quien alterna entre hasta tres dispositivos y puede configurar Options+.
paraQuienNo:
  - Quien busca un ratón ligero para moverlo con pequeños impulsos de los dedos.
  - Quien solo necesita clic, rueda y navegación básica.
  - Usuarios zurdos.
puntosFuertes:
  - Rueda MagSpeed y rueda para el pulgar con desplazamiento horizontal.
  - Actions Ring y respuesta háptica configurable en funciones compatibles.
  - Bluetooth, compatibilidad Bolt y cambio entre tres dispositivos.
  - Batería recargable por USB-C.
puntosDebiles:
  - Pesa 150 g, bastante más que el resto de este lote.
  - Parte del atractivo depende de software y de aplicaciones compatibles.
  - Cable de carga no incluido según la caja estándar descrita por Logitech.
