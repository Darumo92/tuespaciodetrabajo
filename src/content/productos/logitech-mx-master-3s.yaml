en:
  nombreComercial: Logitech MX Master 3S
  idealPara: A fixed desk with spreadsheets, long documents and application shortcuts
  veredicto: >-
    The Logitech MX Master 3S makes sense if you will use its thumb wheel for
    spreadsheets and configure shortcuts. Its 141 g weight and bulky body suit
    a fixed desk better than a laptop bag. Check the edition you choose: this
    profile covers the standard model with a Bolt receiver.
  resumenCompra:
    mejorPara: >-
      Right-handed work on Windows or macOS, moving between long documents and
      wide tables, with permission to install Logi Options+.
    evitarSi: >-
      You want low weight, use your left hand or only need clicking and scrolling.
      It is also unsuitable if you need a USB data connection.
    alternativaDirecta: >-
      The MX Master 4 adds haptic features; consider whether you need them rather
      than assuming better results. The M650 covers simpler office work, while
      the LAMZU MAYA X prioritizes low weight over a thumb wheel and office shortcuts.
    decisionRapida: >-
      Think of an action you would assign to the thumb wheel and buttons in your
      two main applications. If nothing comes to mind, compare the M650 first.
      If you choose the 3S, confirm the included receiver before paying.
  metodologia:
    - >-
      Based on Logitech's official support guide and the Tom's Hardware review,
      consulted on 9 October 2026. We have not tested this mouse or measured
      comfort, noise or battery life.
    - >-
      We distinguish the standard MX Master 3S from the current Bluetooth Edition.
      Comments about control reach belong to the reviewer, not to our own testing
      or a claim about every hand.
  limitaciones:
    - >-
      The standard model's support guide lists an included Logi Bolt receiver
      and charging cable. Logitech's current Bluetooth Edition does not include
      that receiver. Check the box contents for the version you buy; the MX
      Master 3S name and a similar picture do not distinguish them.
    - >-
      The Amazon search helps locate the model but may mix editions. Check the
      reference, receiver, seller, price and availability. The price tier is
      indicative, not a fixed amount or an approved offer. No US offer is verified.
    - >-
      Options+ enables gestures and application profiles on Windows and macOS.
      Linux and ChromeOS support basic use, not the same advanced features.
      Check your work computer's software policy before buying it for shortcuts.
    - >-
      USB-C is for charging, not mouse data. The mouse still needs its wireless
      connection when you plug in the charging cable.
    - >-
      Logitech advertises up to 70 days of battery life, depending on use and
      environment. This is a manufacturer figure, not our measurement.
      Dimensions remain unconfirmed for this standard edition.
  paraQuienSi:
    - People working with wide tables who want a dedicated horizontal thumb wheel.
    - People at a fixed desk who can assign gestures or buttons to specific application actions with Options+.
    - People switching between up to three devices who accept an underside channel button.
  paraQuienNo:
    - People wanting a small, lightweight mouse to carry every day.
    - Left-handed users or anyone needing a wired data connection.
    - People unable to install Options+ who are buying mainly for profiles and gestures.
  puntosFuertes:
    - >-
      MagSpeed scrolling in stepped or free-spin mode. SmartShift switches
      between them according to wheel speed, useful when moving from a few
      lines to scrolling through a long document.
    - A dedicated horizontal thumb wheel, with gestures and application profiles through Options+.
    - >-
      Bluetooth and Logi Bolt with up to three Easy-Switch channels. Manual
      switching uses the underside button; Flow is a separate feature requiring
      Options+ on both compatible computers and setup.
    - Quiet primary clicks and a USB-C rechargeable battery, without disposable batteries.
  puntosDebiles:
    - Its 141 g weight and bulky body work against a preference for low weight and portability.
    - The gesture button may be awkward to reach with your grip.
    - Advanced shortcuts depend on software; the charging cable cannot carry mouse data.
  comunidad: >-
    The Tom's Hardware reviewer found the gesture button difficult to reach with
    their grip. That is one observation, not a universal fault. Within the return
    period, check whether you can press it without repositioning your hand,
    especially if that button is a reason for choosing the Master.
