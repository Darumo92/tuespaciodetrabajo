idealPara: Un puesto fijo con hojas de cálculo, documentos largos y atajos por aplicación
veredicto: >-
  El Logitech MX Master 3S tiene sentido si vas a usar su rueda de pulgar para
  recorrer hojas de cálculo y configurar atajos. Sus 141 g y su cuerpo voluminoso
  encajan mejor en una mesa fija que en una bolsa de portátil. Comprueba la
  edición elegida: esta ficha corresponde al modelo estándar con receptor Bolt.
resumenCompra:
  mejorPara: >-
    Trabajar con la mano derecha en Windows o macOS, alternando documentos
    largos y tablas anchas, con permiso para instalar Logi Options+.
  evitarSi: >-
    Buscas poco peso, usas la mano izquierda o solo necesitas clic y rueda.
    Tampoco es la opción para quien necesita transmitir datos por cable USB.
  alternativaDirecta: >-
    El MX Master 4 añade funciones hápticas; compara si las necesitas, sin dar
    por hecha una mejora en tu trabajo. El M650 cubre oficina sencilla y el
    LAMZU MAYA X prioriza ligereza frente a rueda lateral y atajos de oficina.
  decisionRapida: >-
    Piensa qué acción asignarías a la rueda lateral y a los botones en tus dos
    aplicaciones habituales. Si no encuentras un uso concreto, compara primero
    el M650. Si eliges el 3S, confirma el receptor incluido antes de pagar.
metodologia:
  - >-
    Ficha basada en el soporte oficial de Logitech y el análisis de Tom's
    Hardware, consultados el 9 de octubre de 2026. No hemos probado este ratón
    ni medido comodidad, ruido o autonomía.
  - >-
    Distinguimos el MX Master 3S estándar de la Bluetooth Edition actual.
    Las impresiones sobre alcance de controles se atribuyen al análisis,
    no a una experiencia propia ni a todas las manos.
limitaciones:
  - >-
    El soporte del modelo estándar describe receptor Logi Bolt y cable de carga
    incluidos. La Bluetooth Edition de la tienda actual no incluye ese receptor.
    Comprueba el contenido de caja de la versión que compres; el nombre MX
    Master 3S y una foto parecida no bastan para distinguirlas.
  - >-
    La búsqueda de Amazon ayuda a localizar el modelo, pero puede mezclar
    ediciones. Revisa referencia, receptor, vendedor, precio y disponibilidad.
    El tramo de precio es orientativo, no un importe fijo ni una oferta aprobada.
  - >-
    Options+ permite gestos y perfiles por aplicación en Windows y macOS.
    Linux y ChromeOS ofrecen uso básico, no esas mismas funciones avanzadas.
    Comprueba la política de instalación del ordenador de empresa antes de
    comprarlo por sus atajos.
  - >-
    El USB-C sirve para cargar: no transmite los datos del ratón por el cable.
    Necesitas mantener la conexión inalámbrica, aunque conectes el cable de carga.
  - >-
    Logitech anuncia hasta 70 días de batería, con duración dependiente del uso
    y del entorno. Es una cifra del fabricante, no una medición de esta ficha.
    Las dimensiones quedan sin confirmar para esta edición estándar.
paraQuienSi:
  - Quien recorre tablas anchas y quiere desplazamiento horizontal con una rueda de pulgar dedicada.
  - >-
    Quien trabaja en un puesto fijo y puede asignar gestos o botones a acciones
    concretas de sus aplicaciones con Options+.
  - Quien alterna hasta tres dispositivos y acepta cambiar de canal desde la base.
paraQuienNo:
  - Quien quiere un ratón pequeño y ligero para transportarlo cada día.
  - Usuarios zurdos o quienes necesitan funcionamiento mediante cable de datos.
  - Quien no puede instalar Options+ y lo compra principalmente por los perfiles y gestos.
puntosFuertes:
  - >-
    Rueda MagSpeed para desplazamiento por pasos o libre. SmartShift cambia
    entre ambos modos según la velocidad de giro, útil al pasar de leer unas
    líneas a recorrer un documento largo.
  - >-
    Rueda lateral dedicada para desplazamiento horizontal y botones con gestos
    y perfiles por aplicación mediante Options+.
  - >-
    Bluetooth y Logi Bolt, con hasta tres canales Easy-Switch. El cambio manual
    está en la base; Flow es otra función y requiere Options+ en ambos ordenadores
    compatibles y su configuración.
  - Clics principales silenciosos y batería recargable por USB-C, sin comprar pilas.
puntosDebiles:
  - Sus 141 g y el cuerpo voluminoso son una desventaja si priorizas ligereza y transporte.
  - El botón de gestos puede quedar fuera del alcance cómodo según tu agarre.
  - Los atajos avanzados dependen del software; el cable de carga no ofrece conexión de datos.
comunidad: >-
  El autor del análisis de Tom's Hardware encontró difícil alcanzar el botón de
  gestos con su agarre. Es una observación individual, no un fallo universal.
  Comprueba si puedes pulsarlo sin recolocar la mano dentro del plazo de devolución,
  especialmente si ese botón es una razón para elegir el Master.
