idealPara: "Quien quiere el tope de gama en estructura elevable —doble motor, columnas de tres tramos y acabado premium— y elige su propio tablero"
veredicto: "La E8 es la estructura premium de FlexiSpot: patas ovaladas de acero, doble motor y columnas de tres tramos que suben rápido (38 mm/s), muy estables y por debajo de 45 dB. Aguanta 125 kg y el rango de 60 a 125 cm es de los más amplios, así que sirve tanto para personas bajas como altas. El panel es táctil LED con cuatro memorias, anticolisión y bloqueo infantil. Frente a la E7 gana en diseño y en la sensación de solidez de las patas ovaladas; frente a estructuras más baratas, se nota el acabado y la marcha del doble motor. El pero es el de siempre en esta categoría: se vende sin tablero, así que hay que sumar ese gasto (con tablero de aglomerado, la propia FlexiSpot la vende bastante más cara). Para un setup serio y de largo recorrido, con 5 años de garantía en estructura y motores, es una de las mejores bases."
