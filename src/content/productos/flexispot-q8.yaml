veredicto: "El FlexiSpot Q8 (también llamado Comhar Pro Q8) es el todo-en-uno premium de la marca: llega con tablero de bambú de calidad —resistente al agua, a arañazos y a la polilla—, cajón integrado, carga inalámbrica en la superficie y puerto USB, todo montado de fábrica sin tener que elegir estructura y tablero por separado. Por dentro es un doble motor de 3 etapas que cubre un rango amplio de 61 a 125 cm, soporta 100 kg y trae panel táctil con display LED que muestra la altura al centímetro y 4 memorias, además de anticolisión. La garantía de 10 años y los 60 días de prueba lo colocan como una compra tranquila. Ronda los 700 euros: no es barato, pero por debajo de él tienes que sumar estructura + tablero + accesorios para igualar lo que el Q8 trae de serie. No es para quien solo quiere lo más barato que suba y baje —para eso está el E7 o la gama de entrada—, sino para quien valora el bambú, el cajón y la carga inalámbrica en un mueble que se ve y se usa como premium desde el primer día."
