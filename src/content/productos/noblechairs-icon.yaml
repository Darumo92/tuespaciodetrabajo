idealPara: "Quien quiere una gaming de estética sobria, casi de oficina, con cuero sintético y espuma fría de calidad"
veredicto: "La ICON es la gaming de noblechairs que más se aleja del aspecto de butaca de carreras: su diseño es sobrio, casi de despacho, y eso la hace encajar en un salón o una oficina sin desentonar. Por dentro cumple lo esperado en la gama: espuma fría firme, base de aluminio, reposabrazos 4D y certificación DIN EN 1335. El lumbar va por cojín, no integrado, así que el ajuste fino depende de colocarlo bien, y el reposabrazos lleva poco acolchado. Para quien busca una gaming elegante y bien construida que aguante muchas horas, es una compra sólida; quien quiera el máximo soporte lumbar regulable tendrá que mirar otras opciones."
resumenCompra:
  mejorPara: "Quien quiere una gaming discreta y bien rematada con cuero sintético y espuma fría."
  evitarSi: "Necesitas lumbar integrado regulable o eres de estatura baja."
  alternativaDirecta: "noblechairs HERO si quieres más talla, más reclinación y lumbar integrado de la misma marca."
  decisionRapida: "La gaming que recomendaría a quien valora una estética sobria y un acabado serio por encima del máximo ajuste lumbar."
metodologia:
  - "Specs tomadas de la web oficial de noblechairs y de su ficha tecnica."
  - "La nota prioriza la calidad de materiales (espuma fría, aluminio), los reposabrazos 4D y la certificación EN 1335."
  - "Se penaliza el lumbar por cojín (no integrado) y el escaso acolchado de los reposabrazos."
scoreRationale:
  ergonomia: "Buen soporte general, pero el lumbar va por cojín y no es regulable de forma integrada."
  ajustabilidad: "Reposabrazos 4D, reclinación 90-135 grados y balanceo 11 grados cubren lo esencial."
  materiales: "Espuma fría, base de aluminio y certificación DIN EN 1335 son lo mejor de la silla."
  comodidad: "Asiento firme y cómodo para jornadas largas según reseñas, aunque los reposabrazos van justos de acolchado."
  calidadPrecio: "Correcta: pagas por construcción y acabado, no por la mayor ergonomía regulable."
