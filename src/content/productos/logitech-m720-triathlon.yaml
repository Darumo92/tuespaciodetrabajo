resumenCompra:
  mejorPara: >-
    Trabajar con la mano derecha en varios equipos y preferir una pila AA
    reemplazable, con Bluetooth o conexión mediante receptor Unifying.
  evitarSi: >-
    Buscas poco peso, necesitas clics silenciosos confirmados o quieres una
    conexión de datos por cable USB verificada.
  alternativaDirecta: >-
    El Keychron M6-A1 pesa 78 g y admite datos por USB, además de Bluetooth y
