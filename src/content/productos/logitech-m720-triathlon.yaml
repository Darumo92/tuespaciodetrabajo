paraQuienNo:
  - Quien busca un ratón ligero para moverlo o transportarlo a menudo.
  - Quien necesita silencio confirmado o funcionamiento por cable de datos.
  - Quien usa la mano izquierda y necesita controles adaptados a ella.
puntosFuertes:
