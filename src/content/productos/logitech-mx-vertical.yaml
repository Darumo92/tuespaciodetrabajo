veredicto: El Logitech MX Vertical ofrece agarre a 57°, batería recargable y tres formas de conexión. Comprueba sus medidas y el receptor antes de comprar.
resumenCompra:
  mejorPara: Un puesto fijo con varios equipos donde interesa mantener el mismo ratón y recargar por cable.
  evitarSi: Buscas un ratón compacto o ya tienes un receptor Bolt y quieres compartirlo.
  alternativaDirecta: El Lift es más corto y tiene clics silenciosos, pero funciona con una pila AA.
metodologia:
  - Ficha elaborada con las especificaciones y funciones publicadas por Logitech, contrastando modelo y stock en Amazon.es el 17 de septiembre de 2026.
  - No he probado ni poseo el MX Vertical. Mi ratón habitual es un LAMZU MAYA X; esta ficha no describe una prueba de uso.
limitaciones:
  - Unifying y Logi Bolt no son el mismo sistema de receptor.
  - El cambio de postura no garantiza aliviar molestias ni prevenir una lesión.
paraQuienSi:
  - Quien encuentra demasiado corta la carcasa del Lift y quiere comparar un vertical de 120 mm de largo.
  - Usuarios que alternan entre hasta tres equipos mediante Easy-Switch.
paraQuienNo:
  - Zurdos; el apoyo y los botones están planteados para la mano derecha.
  - Quien necesita compartir un receptor Logi Bolt con otro periférico.
puntosFuertes:
  - Conexión por Bluetooth, receptor Unifying o cable USB-C, según Logitech.
  - Batería recargable y posibilidad de usarlo mientras carga.
  - Cambio de sensibilidad accesible y sensor ajustable de 400 a 4000 DPI.
puntosDebiles:
  - Carcasa alta que hay que valorar si transportas el ratón a menudo.
  - Sistema Unifying distinto del Bolt utilizado por Lift y MX Master 4.
  - No se ha verificado una función de clic silencioso comparable a SilentTouch.
