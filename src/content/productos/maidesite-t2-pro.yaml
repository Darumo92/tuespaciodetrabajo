  capacidadCarga: "160 kg es de lo más alto del mercado de escritorios elevables, muy por encima de los 60-80 kg de los modelos budget."
  rangoAltura: "72-120 cm (solo estructura) cubre la mayoría de estaturas, pero las columnas de dos tramos limitan el mínimo frente a los diseños de tres tramos."
