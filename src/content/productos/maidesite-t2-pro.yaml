fuenteSpecs: "Specs de la ficha oficial de Maidesite (maidesite.de y maidesite.co.uk) para la T2 Pro: velocidad 35 mm/s, altura 72-120 cm (solo estructura), carga 160 kg, peso de la estructura 20,15 kg, motor único, columnas de dos tramos, ruido <45 dB, garantía 10 años, acero recubierto en polvo, anticolisión de tres niveles, arranque suave, bloqueo infantil, 4 memorias y dos puertos USB (A y C de 18 W). Certificación CE/UKCA declarada por el fabricante; no se ha confirmado TÜV ni EMC específicos, por lo que quedan en null. Al venderse sin tablero, los campos de tablero no aplican."
