idealPara: "Quien quiere una estructura elevable barata pero bien equipada, de un motor con 100 kg de carga, USB-C y 10 años de garantía, para poner su propio tablero"
veredicto: "El T1 Pro es la estructura de entrada de Maidesite, pero con más equipamiento del que suele traer la gama baja. Es de un solo motor —sube a 25 mm/s y por debajo de 50 dB— pero aguanta 100 kg, más que muchos elevables de un motor, y se vende como marco extensible (96-160 cm) para poner el tablero que quieras, con compatibilidades desde 100x60 hasta 180x80 cm. Lo que lo diferencia es el detalle: panel con memorias, anticolisión de tres niveles de sensibilidad, arranque y parada suaves, puerto USB-C de 18 W y, sobre todo, 10 años de garantía en la estructura, algo impropio de este precio. Frente al T2 Pro de doble motor, cede en velocidad y suavidad; frente a los marcos baratos de la competencia, gana en carga, equipamiento y garantía. Para un primer elevable sobre el que montar tu propio tablero sin gastar mucho, es de lo más recomendable."
