en:
  nombreComercial: "Maidesite T1 Pro Electric Standing Desk Frame"
  tituloCorto: "Maidesite T1 Pro"
  veredicto: "The T1 Pro is Maidesite's entry frame, but with more kit than the budget tier usually brings. It's single-motor —rising at 25 mm/s and under 50 dB— but holds 100 kg, more than many single-motor desks, and is sold as an extendable frame (96-160 cm) to take whatever top you want, fitting 100x60 up to 180x80 cm. What sets it apart is the detail: a memory panel, three-sensitivity anti-collision, soft start and stop, an 18 W USB-C port, and above all a 10-year frame warranty, unusual at this price. Against the dual-motor T2 Pro, it gives up speed and smoothness; against cheap competitor frames, it wins on load, kit, and warranty. For a first standing base to put your own top on without spending much, it's highly recommendable."
  idealPara: "Anyone who wants a cheap but well-equipped single-motor frame, with 100 kg, USB-C, and a 10-year warranty, for their own tabletop"
  comunidad: "Reviews highlight the 100 kg load uncommon for a single motor, the good kit (USB-C, adjustable anti-collision, soft start), and above all the 10-year warranty at this price. The recurring criticism is the lift speed and that the top is bought separately. As an entry frame, the rating is very good."
  resumenCompra:
    mejorPara: "A cheap but well-equipped single-motor frame, with 100 kg, USB-C, and a 10-year warranty, for your own top."
    evitarSi: "You want the smoothness and speed of a dual motor or a complete, ready-to-use desk."
    alternativaDirecta: "Maidesite SN1 for a dual motor with tabletop included; Maidesite T2 Pro Plus for 160 kg and a dual motor."
    decisionRapida: "The best-equipped single-motor frame for the price: 100 kg, USB-C, and a 10-year warranty; the catch is the slow rise and no top."
  puntosFuertes:
    - "100 kg load, high for a single motor"
    - "Extendable frame (96-160 cm) for 100x60 to 180x80 tops"
    - "Memory panel, adjustable anti-collision, and 18 W USB-C"
