veredicto: "La T3 Rush es la respuesta de Corsair a quien no quiere sudar sobre cuero sintético: su tapizado de tela suave transpira mejor y resulta más agradable en verano que las gaming de polipiel. Trae reposabrazos 4D, reclinación amplia hasta 160 grados y un pistón clase 4, lo básico bien resuelto. El soporte lumbar va por cojín de espuma viscoelástica, no integrado, así que el ajuste depende de colocarlo, y la garantía de dos años se queda corta frente a las marcas que dan cinco. Para quien busca una gaming cómoda, fresca y bien rematada sin pagar de más, es una opción muy razonable."
