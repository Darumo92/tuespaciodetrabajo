en:
  nombreComercial: "IKEA BEKANT Sit/Stand Desk (discontinued)"
  tituloCorto: "IKEA Bekant"
  veredicto: "The IKEA BEKANT sit/stand was for years IKEA's reference electric standing desk and a must-compare in the Spanish market, until it was discontinued. We include it as a historical entry: it's no longer sold new at IKEA Spain, so there's no buy button here, just the data to compare or for anyone considering a second-hand unit. Its strong point was the height range, 65 to 125 cm —among the widest—, with electric button control, a 160x80 cm tabletop with rounded edges to protect forearms and wrists, and a net under the tabletop to organize cables. It was certified to EN 527-2 and ANSI/BIFMA X5.5, an office-furniture durability seal many Amazon rivals lack. Its known drawbacks were a slow rise and that IKEA didn't publish load or speed in detail. It was offered between roughly 359 and 549 euros depending on version. As a reference for comparisons (for example versus the FlexiSpot E7) it's still useful; as a new purchase, it's no longer an option."
  idealPara: "Historical reference: anyone looking for BEKANT sit/stand data to compare (now discontinued in Spain) or to assess a second-hand unit"
  comunidad: "The BEKANT was one of the most discussed standing desks in Spanish forums and comparisons for being 'the IKEA one': people valued the height range, the clean design and the office certification, and criticized the slow rise and occasional warnings that the tabletop could dent with use. After being discontinued, it still appears in historical comparisons and on the second-hand market."
  resumenCompra:
    mejorPara: "Checking historical data to compare or to assess a second-hand BEKANT unit."
    evitarSi: "You want to buy it new: it's discontinued at IKEA Spain; look at current alternatives with a tabletop included."
    alternativaDirecta: "IKEA Idåsen or IKEA Mittzon as current IKEA replacements; FlexiSpot E7 or Maidesite T2 Pro Plus for a new standing desk with more features."
    decisionRapida: "Historical entry for IKEA's standing desk with a 65-125 cm range and office certification; discontinued, no new purchase."
  puntosFuertes:
    - "Very wide height range (65-125 cm)"
    - "Office-furniture certification (EN 527-2, BIFMA X5.5)"
    - "160x80 cm tabletop with rounded edges and cable net"
    - "Useful historical reference for comparisons"
  puntosDebiles:
