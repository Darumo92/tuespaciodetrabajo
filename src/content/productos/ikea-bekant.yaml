idealPara: "Referencia histórica: quien busca datos del BEKANT sentado/de pie de IKEA para comparar (ya descatalogado en España) o valorar una unidad de segunda mano"
veredicto: "El IKEA BEKANT sentado/de pie fue durante años el escritorio elevable eléctrico de referencia de IKEA y una comparación obligada en el mercado español, hasta su descatalogación. Lo incluimos como ficha histórica: ya no se vende nuevo en IKEA España, así que aquí no hay botón de compra, solo los datos para comparar o para quien valore una unidad de segunda mano. Su punto fuerte era el rango de altura, de 65 a 125 cm —de los más amplios—, con control eléctrico por botón, tablero de 160x80 cm de bordes redondeados para proteger antebrazos y muñecas, y una red bajo el tablero para organizar cables. Estaba certificado según las normas EN 527-2 y ANSI/BIFMA X5.5, un aval de durabilidad de mobiliario de oficina que muchos rivales de Amazon no tienen. Sus pegas conocidas eran una subida lenta y que IKEA no publicaba carga ni velocidad con detalle. Se ofertó entre unos 359 y 549 euros según versión. Como referencia para comparativas (por ejemplo frente al FlexiSpot E7) sigue siendo útil; como compra nueva, ya no es una opción."
