comunidad: "Durante 2022-2024 fue uno de los escritorios elevables más comentados en foros de teletrabajo en español, valorado sobre todo por la comodidad de comprarlo y montarlo en el día en tienda física y por su garantía de 10 años. Las críticas más repetidas señalan que muchos compradores dejaban de usar la función eléctrica a las pocas semanas, que la ausencia de memorias obligaba a pulsar botones cada vez, y que a igualdad de precio con un FlexiSpot E7 este último ganaba en solidez y velocidad. Con su retirada del catálogo, la conversación se ha desplazado a qué comprar como sucesor (MITTZON) o alternativa fuera de IKEA."
