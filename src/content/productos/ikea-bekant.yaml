idealPara: "Quien ya tenía o encuentra de segunda mano un BEKANT y quiere saber qué esperar antes de comprarlo usado"
veredicto: "El BEKANT eléctrico fue durante años el escritorio elevable de referencia para quien quería comprarlo todo en una tienda física, montarlo en un rato y no complicarse. Motor doble (uno por pata) pero de baja potencia, rango de altura amplio (65-125 cm), tablero de melamina de 160x80 cm incluido y 10 años de garantía estructural. Lo que nunca tuvo fue memorias de altura (solo botones de subir/bajar) ni anticolisión, y su capacidad de carga de 70 kg y velocidad de unos 25 mm/s se quedaban por detrás de rivales como el FlexiSpot E7. IKEA lo ha retirado de su catálogo y lo ha sustituido por el MITTZON eléctrico; hoy solo se encuentra de segunda mano. Por debajo de 250 EUR y en buen estado puede seguir mereciendo la pena; por encima, mejor comprar nuevo."
resumenCompra:
  mejorPara: "Comprarlo de segunda mano en buen estado y por debajo de 250 EUR si buscas la estética escandinava de IKEA."
  evitarSi: "Necesitas memorias de altura, anticolisión o vas a cambiar de posición varias veces al día sin volver a pulsar botones."
  alternativaDirecta: "IKEA MITTZON eléctrico si quieres quedarte en IKEA con garantía y doble motor moderno; JUMMICO 140x60 o ErGear 140x70 si buscas algo nuevo y barato con memorias."
  decisionRapida: "Un clásico descatalogado que solo recomendaría de segunda mano y a buen precio; para comprar nuevo hay mejores opciones por menos dinero."
metodologia:
  - "Specs cruzadas entre la ficha oficial de IKEA (rango de altura, tablero, garantía, colores), fuentes de precio y liquidación de outlet (Xataka, compradiccion.com, ofertitas.es) y un teardown técnico independiente de la comunidad maker (Hackaday/Hacker News) que documenta el mecanismo real de doble motor Bosch."
  - "La nota prioriza el rango de altura y la garantía estructural de 10 años, y penaliza la ausencia de memorias, anticolisión y la menor capacidad de carga frente a rivales actuales."
scoreRationale:
  velocidad: "Motor doble pero de baja potencia (motores Bosch pequeños); velocidad estimada por debajo de escritorios de gama media como el FlexiSpot E7."
  estabilidad: "Reseñas de usuarios son contradictorias: algunas lo describen estable, otras señalan holgura en los conectores plásticos tablero-estructura en ciertas unidades."
  capacidadCarga: "70 kg es una cifra baja frente a los 100-160 kg de escritorios actuales de gama media-alta."
  rangoAltura: "65-125 cm es un rango amplio, de los mejores de esta comparativa."
  materiales: "Tablero de melamina resistente y estructura de acero con pies de aluminio; nivel correcto pero sin la robustez de estructuras de 3 columnas."
  calidadPrecio: "A su precio de venta original (459-549 EUR) competía con escritorios que ya ofrecían memorias y anticolisión; hoy solo tiene sentido de segunda mano y barato."
