fuenteSpecs: "Specs oficiales de IKEA (altura 65-125 cm, tablero de melamina 160x80 cm, colores blanco/fresno/roble, garantía 10 años) confirmadas con fuentes de precio de outlet (Xataka, compradiccion.com: precio original ~549 EUR, liquidación a 299 EUR) y un teardown técnico independiente (Hackaday/Hacker News) que confirma mecanismo de doble motor Bosch 24V, uno por pata. Ausencia de memorias y anticolisión confirmada por comparativa propia con dos unidades probadas por compañeros. No hay dato oficial de velocidad en mm/s ni de nivel de ruido en dB verificado de forma independiente, por lo que quedan en null. Producto descatalogado: no aplica ASIN de Amazon ni precio verificable de venta actual."
