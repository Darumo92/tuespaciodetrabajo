idealPara: "Quien busca un elevable barato con estética gaming/minimalista, tablero incluido, 4 memorias y anticolisión, para un home office o setup con un uso normal"
veredicto: "HOMALL es una de esas marcas de Amazon.es que copan la gama baja de escritorios elevables, y su modelo de 120x60 es un habitual en las listas de más vendidos. La propuesta es la de siempre en este tramo: un único motor que sube de 72 a 116 cm de forma silenciosa, 80 kg de carga y tablero incluido, con la ventaja de traer panel LED con 4 memorias, anticolisión que se detiene al topar con un obstáculo y un par de ganchos para colgar auriculares o mochila. La estructura es de dos patas de acero con doble refuerzo diagonal y, pese a ello, los usuarios coinciden en que aguanta estable incluso en alto para un uso normal. Frente a rivales como Devoko o DEVAISE, HOMALL juega la carta del diseño (acabados blanco/negro que encajan en setups gaming) y las 4 memorias. Sus límites son los de la gama de entrada: el motor único no está pensado para alternar sentado-de pie decenas de veces al día ni para cargar varios monitores pesados. Como elevable económico para empezar, cumple de sobra."
