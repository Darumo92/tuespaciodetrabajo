veredicto: "La Ergohuman GEN2 es la malla ergonómica clásica que lleva años funcionando como alternativa a la Aeron por bastante menos dinero. Su gran baza es el panel lumbar dinámico de 6 vías que acompaña la zona lumbar en lugar de empujar con presión fija, sumado a malla integral en asiento, respaldo y reposacabezas, y reposabrazos 4D. No es la silla más fina de acabado ni la más moderna de estética, pero entrega ergonomía de malla completa con reposacabezas regulable que pocas rivales de su tramo ofrecen. La cobertura de por vida en piezas (5 años en tapicería) refuerza la sensación de compra a largo plazo."
