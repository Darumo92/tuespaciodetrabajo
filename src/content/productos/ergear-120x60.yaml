idealPara: "Quien busca un elevable compacto y barato para espacios reducidos, con panel de 4 memorias y tablero ya ensamblado para montar en minutos"
veredicto: "El ErGear 120x60 es la versión compacta y aún más barata del ErGear 140x70 que ya tenemos en catálogo, pensada para escritorios pequeños y primeros compradores. Es un elevable de motor único, así que sube despacio y se queda por debajo de 50 dB, pero a cambio trae panel LED con cuatro memorias —algo que muchos rivales de su precio no ofrecen— y viene con el tablero ya ensamblado, lo que reduce el montaje a atornillar las patas. Aguanta 80 kg, algo más que el Devoko, con un rango de 72 a 118 cm y un marco de aleación de 65 mm sobre tablero de 15 mm. No es un escritorio para subir y bajar todo el día ni para montajes de varios monitores pesados, y no consta anticolisión, pero para un home office compacto con un monitor y presupuesto ajustado cumple de sobra. Si el 140x70 se te va de tamaño o de precio, este es su hermano pequeño lógico."
