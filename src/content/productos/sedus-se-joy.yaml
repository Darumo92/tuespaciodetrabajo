  alternativaDirecta: "Humanscale Diffrient Smart si buscas otra silla de filosofía autoajustable sin apenas mandos."
  decisionRapida: "Una talla para casi todos: la pones y te sostiene, sin manual de instrucciones. Ese es el trato."
