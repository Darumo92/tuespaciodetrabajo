veredicto: "La idea de la se:joy es renunciar a los ajustes: asiento y respaldo forman una sola estructura cubierta por una membrana de tejido de punto que cede y se adapta a cada cuerpo automáticamente, sin lumbar regulable ni mandos que aprender. Esa simplicidad es su gracia y a la vez su límite, porque si necesitas afinar un soporte concreto, aquí no vas a poder. Los reposabrazos no vienen de serie: son opcionales. A favor juega el sello Sedus, con balancín de suspensión y certificaciones de sobra."
