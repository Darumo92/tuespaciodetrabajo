en:
  nombreComercial: "Newskill Takamikura V2"
  veredicto: "The Takamikura V2 balances price and features better than the average in its bracket: it fits breathable fabric instead of synthetic leather, adds 4D armrests, recline from 90 to 180 degrees to lie fully flat and supports up to 150 kg, a high capacity for its category. It isn't a clinically adjustable ergonomic chair and the lumbar is a cushion, not integrated, but for the money it offers a set of adjustments and breathability hard to match. A good choice for anyone after an affordable gaming chair without overheating."
  idealPara: "Gaming on a contained budget with breathable fabric, 4D armrests and 180° recline"
  comunidad: "Rated as one of the best value buys in Spanish gaming: the breathable fabric, 4D armrests and recline up to 180° are liked, plus the 150 kg capacity. The usual criticisms point to the cushion lumbar rather than integrated and that, like any gaming chair at this price, it doesn't reach the fine adjustment of an ergonomic office chair."
  resumenCompra:
    mejorPara: "Anyone wanting fabric gaming with 4D armrests and 180° recline while spending little."
    evitarSi: "You need an adjustable integrated lumbar or a premium build."
    alternativaDirecta: "Corsair TC100 if you prefer a wider seat, albeit with 2D armrests."
    decisionRapida: "The affordable gaming chair I'd recommend to anyone who overheats on synthetic leather and wants 4D armrests."
  puntosFuertes:
