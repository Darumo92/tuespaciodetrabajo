veredicto: "La Diffrient Smart lleva al extremo la filosofía de Humanscale: una malla form-sensing que se amolda al cuerpo y una reclinación activada por el peso, sin palancas de tensión ni lumbar manual. Es comodísima de usar y casi no hay nada que configurar; su contrapartida es que quien quiere control fino de cada parámetro se encontrará con muy pocos ajustes para el precio."
