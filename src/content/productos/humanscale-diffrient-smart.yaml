veredicto: "La Diffrient Smart lleva al extremo la filosofía de Humanscale: una malla form-sensing que se amolda al cuerpo y una reclinación activada por el peso, sin palancas de tensión ni lumbar manual. Es comodísima de usar y casi no hay nada que configurar; su contrapartida es que quien quiere control fino de cada parámetro se encontrará con muy pocos ajustes para el precio."
resumenCompra:
  mejorPara: "Quien quiere comodidad sin configurar nada y valora la malla que se adapta al cuerpo y la garantía de 15 años."
  evitarSi: "Necesitas lumbar regulable manual o muchos ajustes individuales, o el respaldo bajo no te basta."
  alternativaDirecta: "Humanscale Freedom si quieres reposacabezas y el mismo enfoque sin palancas de la marca."
  decisionRapida: "La elegiría por su comodidad sin ajustes y su garantía larga, asumiendo que renuncias a regulación fina."
metodologia:
  - "Se han contrastado las specs de la web oficial de Humanscale con la reseña de BTOD citada en fuenteSpecs."
  - "La nota pondera la malla form-sensing, la reclinación por peso y la garantía de 15 años."
  - "Se penaliza la ausencia de lumbar regulable manual y de ajustes individuales frente al precio."
scoreRationale:
  ergonomia: "La malla form-sensing y el soporte lumbar continuo automático funcionan bien para la mayoría de cuerpos."
  ajustabilidad: "Filosofía de cero palancas: muy pocos ajustes manuales, lo que penaliza la nota."
  materiales: "Malla tri-panel de calidad, soporte de aluminio y construcción duradera de Humanscale."
  comodidad: "Muy cómoda desde el primer momento gracias al ajuste automático por peso."
  calidadPrecio: "Comodidad y garantía excelentes, pero la falta de ajustes la penaliza para su precio."
