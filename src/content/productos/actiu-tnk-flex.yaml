veredicto: "La TNK Flex es una silla de contract española pensada para uso intensivo de hasta 24 horas y usuarios de hasta 150 kg, y se nota en la construcción: marco de polipropileno con fibra de vidrio, asiento basculante 360 grados que acompaña el movimiento y mecanismo sincro de 4 posiciones de 0 a 30 grados con tensión regulable. No es una silla que compres en Amazon ni con specs de gaming llamativas, sino una herramienta de oficina con certificación de uso intensivo y diseño de Alegre Design. Su punto débil es el precio y que la configuración (brazos, base, cabecero) se elige por separado, así que la silla base puede quedarse algo justa de ajustes."
