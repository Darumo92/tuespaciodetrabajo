veredicto: "La Dot Pro es la silla operativa de gama media-alta de Forma5, fabricante español de mobiliario de oficina con buena reputación en contract. Combina respaldo alto de malla 3D con un asiento de espuma de poliuretano inyectada y un mecanismo Sincro Motion que regula 24 grados de respaldo y 10 grados de asiento, ajustándose de forma automática al peso del usuario entre 45 y 110 kg. Está bien dotada de certificaciones europeas (UNE-EN 1335, NF Environnement) y permite configurar brazos hasta 4D de aluminio, lumbar flexible opcional y cabecero. Como las otras de contract, no se compra de forma directa por Amazon España y la silla base puede ampliarse mucho con opcionales."
