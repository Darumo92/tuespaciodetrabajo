idealPara: "Quien quiere un elevable de gama media-alta con fabricación europea, tableros hechos en España y un rango de altura enorme, comprando a una marca nacional con 100 días de prueba"
veredicto: "Eleva es una marca española que diseña y fabrica sus elevables con componentes europeos y tableros hechos en España, algo poco habitual en un mercado dominado por marcas asiáticas de Amazon. El Eleva Pro es su tope de gama: doble motor, 100 kg de carga y, sobre todo, un rango de altura excepcional de unos 60 a 126 cm —de los más amplios que se ven—, que va desde estaturas bajas trabajando sentadas hasta personas muy altas de pie, e incluso permite montarlo como escritorio para trabajar sentado en el suelo o de pie con holgura. Sube a 38 mm/s con 4 memorias y sistema anticolisión, y admite tableros de hasta 2 metros de largo, ideal para setups grandes o multimonitor. Frente a un FlexiSpot o Maidesite de precio parecido, el argumento de Eleva es la proximidad (soporte y garantía nacionales, 5 años, 100 días de prueba) y la fabricación europea del tablero. No es la opción más barata ni la más rápida, pero es de las pocas formas de comprar un elevable serio a una marca española con acabado de calidad. Para quien valora comprar nacional y un rango de altura que no se le quede corto, es una gran elección."
