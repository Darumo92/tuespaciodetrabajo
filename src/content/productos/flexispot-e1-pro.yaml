veredicto: "El E1 PRO es la puerta de entrada de FlexiSpot al escritorio elevable eléctrico: mantiene el doble motor (uno por pata) en lugar del motor único que usan otros modelos de su rango de precio, con un rango de altura de 70 a 119 cm y hasta 100 kg de carga en movimiento. Es más lento que los modelos superiores (unos 25 mm/s) y no incluye puerto USB ni bloqueo infantil, pero las reseñas coinciden en que el movimiento es suave y sin vibraciones para tareas de oficina normales. Si el presupuesto es la prioridad y no necesitas cargar mucho peso ni subir muy alto, es de las opciones más honestas de su tramo."
