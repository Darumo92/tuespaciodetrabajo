veredicto: "Esta estructura de SANODESK es una de las formas más baratas de tener un doble motor certificado TÜV Rheinland: por debajo de 200 euros, sin tablero, subes con dos motores a 32 mm/s por columnas de tres tramos, con un rango de 60 a 125 cm que vale para casi cualquier estatura. Aguanta 100 kg, trae panel LED con cuatro memorias, anticolisión y bloqueo infantil, y por debajo de 50 dB apenas se oye. Compite de tú a tú con la FlexiSpot E5: aquí ganas la certificación TÜV explícita en los motores y un precio parecido; pierdes algo de velocidad frente a los 35 mm/s de la E5. Como toda estructura, hay que sumar el tablero aparte. Para montar un elevable de doble motor fiable sin gastar de más, es una compra muy sólida."
