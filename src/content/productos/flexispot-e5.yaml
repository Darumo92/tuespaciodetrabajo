fuenteSpecs: "Specs de la ficha oficial de FlexiSpot (España y global) para la serie E5: velocidad 35 mm/s, altura 60-125 cm (solo estructura), carga 100 kg, doble motor, columnas de tres tramos, ruido <50 dB, bastidor de acero SPCC de 2 mm, panel con 4 memorias y anticolisión. Garantía FlexiSpot ES de 5 años en estructura y 3 años en electrónica; certificaciones de marca TÜV/CE/BIFMA. No se ha confirmado el peso exacto de la estructura ni el puerto USB, y al venderse sin tablero esos campos no aplican, por lo que quedan en null. Nota: algunas fichas de FlexiSpot ES citan hasta 140 kg; se usa el valor de 100 kg por ser el consenso de la ficha global y las reseñas independientes."
