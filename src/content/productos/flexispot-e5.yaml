idealPara: "Quien quiere un doble motor de tres tramos por poco dinero y elige su propio tablero"
veredicto: "La E5 es el doble motor de tres tramos más asequible de FlexiSpot: por debajo de 180 euros, en versión estructura, tienes lo que en muchas marcas cuesta bastante más. Sube a 35 mm/s, con transición suave y por debajo de 50 dB, y el rango de 60 a 125 cm es de los amplios, así que vale para casi cualquier estatura. Aguanta 100 kg, suficiente para dos monitores y accesorios, y el bastidor es de acero SPCC de 2 mm. El panel trae cuatro memorias y anticolisión. No es tan estable ni tan rápida como la E8 de patas ovaladas —el acabado es más sencillo y la carga algo menor—, pero por el precio es difícil pedirle más. Como siempre en estructura, el tablero se compra aparte. Con 5 años de garantía, es de las mejores bases para montar un elevable sin gastar de más."
