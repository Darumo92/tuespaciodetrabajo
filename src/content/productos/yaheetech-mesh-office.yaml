veredicto: "Esta Yaheetech de malla es una silla de oficina de entrada pensada para gastar poco: respaldo alto de malla de poliéster, cabecero acolchado ajustable, cojín lumbar móvil y reposabrazos abatibles 90 grados acolchados que dejan guardarla bajo la mesa. Soporta hasta 136 kg y tiene una función de balanceo. No es una silla de ergonomía avanzada (los ajustes son básicos y los materiales acompañan al precio), pero para un escritorio en casa o un puesto de uso ocasional ofrece más equipamiento del que cabría esperar por su coste. Es la típica compra sensata cuando el presupuesto manda."
