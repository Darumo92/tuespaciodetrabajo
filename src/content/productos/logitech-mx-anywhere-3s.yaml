idealPara: Llevar el portátil entre puestos sin ocupar un puerto con receptor
veredicto: >-
  El Logitech MX Anywhere 3S combina un cuerpo de 100,5 mm de largo y 99 g con
  rueda MagSpeed y atajos configurables. Es una opción para transportar con el
  portátil si aceptas menos apoyo de palma. Funciona por Bluetooth sin receptor;
  la compatibilidad con Bolt no significa que venga uno en la caja.
resumenCompra:
  mejorPara: >-
    Alternar entre puestos con un portátil y hasta tres dispositivos, manteniendo
    rueda rápida y perfiles por aplicación en Windows o macOS.
  evitarSi: >-
    Quieres un cuerpo grande para apoyar la palma, una rueda lateral dedicada
    o un receptor incluido para un ordenador sin Bluetooth.
  alternativaDirecta: >-
    El M650 cubre tareas sencillas sin el enfoque de atajos del MX. El MX Master
    4 tiene rueda de pulgar y un cuerpo mayor; el Lift cambia a formato vertical,
    sin que esa forma garantice comodidad ni alivio de molestias.
  decisionRapida: >-
    Comprueba el Bluetooth del equipo y si un cuerpo de 100,5 x 65 x 34,4 mm
    encaja con tu agarre. Si trabajas mucho con tablas anchas, decide si prefieres
    una rueda de pulgar o aceptas mantener un botón lateral mientras giras la rueda.
metodologia:
  - >-
    Basado en la ficha y el soporte oficiales de Logitech y en el análisis de
    Tom's Hardware, consultados el 9 de octubre de 2026. No hemos probado este
    ratón ni medido autonomía, comodidad o ruido.
  - >-
    La variante documentada es la estándar grafito 910-006929. Usamos las medidas
    oficiales, no los campos genéricos de dimensiones del anuncio de Amazon.
limitaciones:
  - >-
    No incluye receptor Logi Bolt; se compra por separado si lo necesitas.
    La caja estándar contiene el ratón y cable USB-A a USB-C para cargarlo.
    Comprueba que el ordenador admite Bluetooth o cuenta con el receptor adecuado.
  - >-
    El enlace Amazon corresponde al modelo estándar identificado, pero no
    acredita una oferta actual aprobada. Comprueba variante, vendedor, precio y
    existencias. El tramo de precio es orientativo y no fija un importe.
  - >-
    Logitech documenta el cable para carga. No hemos confirmado transmisión de
    datos por USB para esta ficha; no lo elijas suponiendo que podrá funcionar
    como ratón por cable.
  - >-
    Options+ permite perfiles, gestos y ajustes avanzados en Windows y macOS.
    El uso básico en Linux o ChromeOS no incluye esas mismas funciones.
    En un equipo de empresa, comprueba primero si puedes instalar el programa.
  - >-
    El cuerpo compacto puede dejar menos apoyo de palma, especialmente con manos
    grandes. Las medidas no garantizan ajuste: comprueba el agarre y el alcance
    de los botones, que están en el lado izquierdo para usarlos con la mano derecha.
paraQuienSi:
  - Quien lleva el ratón con el portátil y prioriza un cuerpo compacto de 99 g.
  - Quien tiene Bluetooth y quiere dejar libres los puertos USB sin comprar un receptor.
  - Quien recorre documentos largos y puede configurar la rueda y sus atajos en Options+.
paraQuienNo:
  - Quien busca apoyo amplio de palma o una rueda horizontal independiente.
  - Quien necesita receptor incluido o conexión de datos por cable confirmada.
  - Quien usa la mano izquierda y necesita el mismo acceso a los botones laterales.
puntosFuertes:
  - >-
    Cuerpo de 100,5 x 65 x 34,4 mm y 99 g: más ligero y compacto para transportar
    que el MX Master 3S de 141 g, sin prometer el mismo apoyo de mano.
  - >-
    Rueda MagSpeed por pasos o libre, SmartShift y resistencia ajustable desde
    Options+. Puedes adaptar el tacto y el cambio de modo al recorrer documentos.
  - >-
    Desplazamiento horizontal manteniendo un botón lateral y girando la rueda
    mediante Options+. No tiene rueda de pulgar dedicada, pero sí esa alternativa
    para moverte por tablas anchas.
  - >-
    Bluetooth y hasta tres dispositivos con Easy-Switch en la base. Flow es una
    función distinta: requiere Options+ en ambos ordenadores compatibles y configuración.
  - Clics principales silenciosos y batería de 500 mAh recargable por USB-C.
puntosDebiles:
  - El tamaño pensado para transporte puede quedarse corto si apoyas toda la palma.
  - Para usar Bolt hay que añadir un receptor; compatibilidad no equivale a contenido de caja.
  - Los perfiles, gestos y ajustes avanzados dependen de Options+ y del sistema operativo.
comunidad: >-
  Tom's Hardware señala el cuerpo pequeño como una limitación de ajuste y la
  ausencia de rueda de pulgar dedicada. Son aspectos que conviene comprobar según
  tu agarre y trabajo: prueba el apoyo de palma y el desplazamiento horizontal
  con botón lateral antes de decidir si sustituye a un ratón de mesa mayor.
