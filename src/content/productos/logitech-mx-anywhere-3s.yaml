en:
  nombreComercial: Logitech MX Anywhere 3S
  idealPara: Moving a laptop between workspaces without occupying a port with a receiver
  veredicto: >-
    The Logitech MX Anywhere 3S combines a 100.5 mm long, 99 g body with MagSpeed
    scrolling and configurable shortcuts. It suits laptop travel if you accept
    less palm support. Bluetooth works without a receiver; Bolt compatibility
    does not mean a receiver comes in the box.
  resumenCompra:
    mejorPara: >-
      Moving between workspaces with a laptop and up to three devices, while
      keeping fast scrolling and application profiles on Windows or macOS.
    evitarSi: >-
      You want a large body for palm support, a dedicated thumb wheel or an
      included receiver for a computer without Bluetooth.
    alternativaDirecta: >-
      The M650 covers simpler tasks without the MX shortcut focus. The MX Master
      4 has a thumb wheel and larger body; the Lift changes to a vertical shape,
      which does not guarantee comfort or relief from discomfort.
    decisionRapida: >-
      Check your computer's Bluetooth and whether a 100.5 x 65 x 34.4 mm body
      suits your grip. For frequent work with wide tables, decide whether you
      prefer a thumb wheel or can hold a side button while turning the main wheel.
  metodologia:
    - >-
      Based on Logitech's official product page and support guide and the Tom's
      Hardware review, consulted on 9 October 2026. We have not tested this mouse
      or measured battery life, comfort or noise.
    - >-
      The documented variant is the standard graphite 910-006929. We use official
      dimensions rather than generic dimension fields in the Amazon listing.
  limitaciones:
    - >-
      The Logi Bolt receiver is not included and must be bought separately if
      needed. The standard box contains the mouse and a USB-A to USB-C charging
      cable. Check that your computer supports Bluetooth or has a suitable receiver.
    - >-
      The Amazon link identifies the standard model but does not establish a
      currently approved offer. Check the variant, seller, price and stock.
      The price tier is indicative, not a fixed amount. No US offer is verified.
    - >-
      Logitech documents the cable for charging. USB data transmission is
      unconfirmed in this profile; do not choose it assuming it will work as
      a wired mouse.
    - >-
      Options+ enables profiles, gestures and advanced settings on Windows and
      macOS. Basic use on Linux or ChromeOS does not include the same features.
      Check whether your work computer allows the software before buying.
    - >-
      The compact body can provide less palm support, especially for larger
      hands. Dimensions do not guarantee fit: check your grip and button reach.
      Side buttons sit on the left for right-handed use.
  paraQuienSi:
    - People carrying a mouse with a laptop who prioritize a compact, 99 g body.
    - People with Bluetooth who want free USB ports without buying a receiver.
    - People scrolling through long documents who can configure the wheel and shortcuts in Options+.
  paraQuienNo:
    - People wanting broad palm support or a separate horizontal wheel.
    - Anyone needing an included receiver or confirmed wired data operation.
    - Left-handed users who need equal access to the side buttons.
  puntosFuertes:
    - >-
      A 100.5 x 65 x 34.4 mm body weighing 99 g: lighter and more compact to carry
      than the 141 g MX Master 3S, without promising the same hand support.
    - >-
      Stepped or free-spin MagSpeed scrolling, SmartShift and adjustable wheel
      resistance through Options+. You can adjust the feel and mode switching
      for scrolling through documents.
    - >-
      Horizontal scrolling by holding a side button and turning the wheel through
      Options+. There is no dedicated thumb wheel, but this provides another way
      to navigate wide tables.
    - >-
      Bluetooth and up to three devices with underside Easy-Switch. Flow is a
      separate function requiring Options+ on both compatible computers and setup.
    - Quiet primary clicks and a 500 mAh battery rechargeable over USB-C.
  puntosDebiles:
    - The portable size may feel too small if you rest your whole palm on the mouse.
    - Bolt use requires an additional receiver; compatibility does not mean it is included.
    - Profiles, gestures and advanced settings depend on Options+ and the operating system.
  comunidad: >-
    Tom's Hardware notes the small body's fit limitations and lack of a dedicated
    thumb wheel. Check these against your grip and work: try the palm support and
    side-button horizontal scrolling before deciding whether it can replace a
    larger desk mouse.
