en:
  nombreComercial: "IKEA JÄRVFJÄLLET"
  veredicto: "The Järvfjället is the most ergonomic option in IKEA's catalogue: height-adjustable lumbar, adjustable seat depth and an aluminium base certified to EN 1335 + BIFMA. The firm seat and the lack of mesh are its real limits, but for its ~€249 price it offers more adjustments than many chairs costing twice as much."
  idealPara: "Anyone wanting good basic ergonomics from IKEA with more adjustments than the Markus"
  comunidad: "Well regarded as a step between the Markus and premium chairs. BTOD and Spacehop highlight the adjustable lumbar as a differentiator over the Markus. The most repeated criticism: a seat too hard for long days and hard-plastic armrests. Good value, not a substitute for serious office ergonomic chairs."
  puntosFuertes:
    - "Height-adjustable lumbar support"
    - "Adjustable seat depth"
    - "2D armrests (height and width)"
    - "10-year IKEA warranty"
    - "Mid price with good ergonomic features"
  puntosDebiles:
    - "Upholstered backrest (not mesh), less breathable"
    - "No advanced recline tension adjustment"
    - "Limited customisation versus premium chairs"
  paraQuienSi:
    - "IKEA users who want more ergonomic adjustment than the Markus"
    - "Home workers with a €200-300 budget who prioritise adjustable lumbar support"
    - "People who combine a fixed desk with occasional standing work"
    - "Anyone who prefers immediate availability in an IKEA store in Spain"
  paraQuienNo:
    - "Users who need breathable mesh (upholstered backrest)"
    - "People with long days who need a very padded seat"
    - "Anyone over 110 kg"
    - "Buyers comparing with mid-to-high-end ergonomic chairs (>€400)"
