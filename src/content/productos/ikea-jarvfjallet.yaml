idealPara: "Quienes buscan ergonomía básica buena en IKEA con más ajustes que la Markus"
veredicto: "La Järvfjället es la opción más ergonómica del catálogo IKEA: lumbar ajustable en altura, profundidad de asiento regulable y base de aluminio certificada EN 1335 + BIFMA. El asiento firme y la falta de malla son sus límites reales, pero para su precio de ~249 € ofrece más ajustes que muchas sillas del doble de coste."
comunidad: "Bien considerada como paso intermedio entre la Markus y sillas premium. BTOD y Spacehop destacan el lumbar ajustable como ventaja diferencial sobre la Markus. La crítica más repetida: asiento demasiado duro para jornadas largas y reposabrazos de plástico duro. Buena calidad-precio, no un sustituto de sillas ergonómicas de oficina serias."
