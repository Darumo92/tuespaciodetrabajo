veredicto: "Donde la TC500 LUXE saca pecho es en los reposabrazos: el sistema 5D Omniflex se mueve en cinco direcciones (arriba/abajo, izquierda/derecha, adelante/atrás, giro y reverso), de los más versátiles que se ven en gaming. Súmale tela transpirable acolchada en lugar de polipiel y reclinación hasta 160 grados, y tienes una silla pensada para sesiones largas sin sudar la espalda. El pero llega en la letra pequeña: garantía de solo 2 años y lumbar de 4 vías que, aun siendo útil, no es un soporte ergonómico dinámico de gama alta."
