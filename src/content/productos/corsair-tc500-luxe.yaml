comunidad: "Corsair es marca conocida en periféricos y su gama de sillas gaming se mueve en el terreno de la tela transpirable frente a la polipiel habitual. La TC500 LUXE se comenta sobre todo por sus reposabrazos 5D Omniflex, que muchos usuarios destacan como su mejor baza, y por la comodidad de la tela en sesiones largas. La crítica que más aparece es la garantía de 2 años, más corta que la de varias rivales directas, y que el lumbar, aun ajustable, no compite con un soporte dinámico de malla."
