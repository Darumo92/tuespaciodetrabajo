veredicto: "La M18 ofrece lumbar ajustable en dos ejes y cojín W cómodo a un precio de entrada que pocas rivales igualan; sus reposabrazos fijos y la base de nylon la alejan de la gama media, pero para uso de 4-6 h diarias representa una compra muy sólida."
comunidad: "MMORPG.com le da 8/10 destacando el lumbar de cuatro vías y el cojín firme; TechGearLab la califica 66/100 señalando ruedas poco deslizantes y controles muy duros de operar. Consenso: mejor silla ergonómica de entrada por debajo de 200 €, con la advertencia de que los reposabrazos no se ajustan en anchura."
