en:
  nombreComercial: "SIHOO M18"
  veredicto: "The M18 offers two-axis adjustable lumbar and a comfortable W-shaped cushion at an entry price few rivals match; its fixed armrests and nylon base keep it out of the mid range, but for 4-6 h of daily use it's a very solid buy."
  idealPara: "A ~€150-170 budget, moderate home-office work without demanding premium"
  comunidad: "MMORPG.com gives it 8/10, highlighting the four-way lumbar and the firm cushion; TechGearLab rates it 66/100, noting low-glide castors and very stiff controls to operate. Consensus: the best entry-level ergonomic chair under €200, with the caveat that the armrests don't adjust for width."
