amazon:
  buscar: Perixx PERIMICE-513 USB-A negro
webOficial: https://eu.perixx.com/products/perimice-513
idealPara: Un puesto fijo con Windows y preferencia por cable frente a pilas
veredicto: >-
  El Perixx PERIMICE-513 USB-A es un vertical para diestros que recibe datos y
  alimentación por un cable de 1,8 m. Tiene sentido si quieres prescindir de pilas
  y receptor; comprueba que el cable llega y no limita el movimiento en tu mesa.
resumenCompra:
  mejorPara: >-
    Un sobremesa o portátil con Windows que permanece en el mismo puesto, donde
    puedes dejar conectado el USB-A y colocar el cable con holgura.
  evitarSi: >-
    Buscas una mesa sin cable de ratón, Bluetooth, cambio entre equipos o
    compatibilidad completa de botones en macOS confirmada por el fabricante.
  alternativaDirecta: >-
    El Anker A7852 usa receptor USB-A y dos pilas AAA no incluidas. Libera de
    cable la zona de movimiento, pero mantiene la necesidad de un puerto USB-A.
  decisionRapida: >-
    Mide el recorrido real desde el puerto hasta la zona del ratón y deja margen
    para moverlo. Confirma la variante negra USB-A PERIMICE-513N, referencia 11168;
    la versión USB-C y el inalámbrico PERIMICE-713 no son esta ficha.
metodologia:
  - >-
    Revisamos la página oficial, sus variantes y el manual PERIMICE-513 de
    Perixx, consultados el 3 de octubre de 2026. No hemos probado el ratón ni
    medido su comodidad, precisión o duración.
  - >-
    Usamos las instrucciones específicas del modelo 513. El manual también
    contiene el inalámbrico 713; sus indicaciones sobre pilas y reposo no
    corresponden a este ratón por cable.
limitaciones:
  - >-
    La búsqueda de Amazon puede mezclar variantes. Comprueba el conector USB-A,
    el color negro y la referencia PERIMICE-513N / PM-513N-11168. La página oficial
    también muestra una versión USB-C, que no debes identificar solo por la foto principal.
  - >-
    El tramo económico es orientativo y se basa en una consulta de Amazon.es del
    3 de octubre de 2026. No es un precio fijo ni una garantía de existencias;
    revisa el vendedor, la variante y las condiciones de la oferta que elijas.
  - >-
    El manual y el texto oficial indican 1000 y 1600 DPI para el 513. Una imagen
    promocional muestra otros niveles; esta ficha sigue el manual específico
    del modelo, no esa imagen.
  - >-
    Las fuentes discrepan sobre las dimensiones y el peso. Dejamos esos campos
    sin dato en lugar de elegir una cifra o deducir un peso sin cable.
  - >-
    Perixx lo orienta a manos medianas o grandes, pero no ofrece aquí un corte
    numérico de talla verificado. Comprueba el alcance de la rueda y los botones;
    esa orientación no garantiza que el agarre te resulte cómodo.
  - >-
    La compatibilidad documentada es Windows con conexión directa sin instalar
    controladores específicos. No se promete funcionamiento completo en macOS,
    dispositivos móviles ni una herramienta de reasignación de botones.
paraQuienSi:
  - >-
    Quien quiere un ratón para la mano derecha que funcione sin comprar pilas,
    recargar una batería ni conservar un receptor pequeño.
  - >-
    Quien tiene un puesto fijo con Windows y un puerto USB-A al que llega el
    cable de 1,8 m sin quedar tenso.
  - >-
    Quien busca el tamaño orientado por Perixx a manos medianas o grandes y puede
    comprobar el ajuste, incluidos los botones de pulgar, con opción de devolución.
  - >-
    Quien necesita clic de rueda y avance y retroceso para navegar, sin buscar
    una configuración avanzada de atajos.
paraQuienNo:
  - Quien mueve el portátil entre mesas y prefiere no conectar un cable de ratón cada vez.
  - Quien necesita Bluetooth o cambiar entre equipos desde el propio ratón.
  - Quien quiere conexión USB-C directa y no dispone de USB-A ni desea añadir un adaptador.
puntosFuertes:
  - >-
    El cable USB-A de 1,8 m transmite el movimiento y alimenta el ratón. No
    necesita pilas, batería, carga ni receptor inalámbrico.
  - >-
    Seis controles identificados en el manual: clic izquierdo, clic derecho,
    clic de rueda, selector de DPI, avance y retroceso.
  - >-
    Sensor óptico con dos ajustes de 1000 y 1600 DPI y uso plug-and-play en
    Windows. Puedes cambiar la sensibilidad con su botón sin prometer más
    precisión por seleccionar el nivel más alto.
puntosDebiles:
  - >-
    El cable tiene que llegar desde el ordenador sin engancharse ni tirar del
    ratón. Comprueba el recorrido por detrás de la mesa, no solo la distancia
    en línea recta al puerto.
  - >-
    No dispone de Bluetooth ni receptor, y no alterna entre dispositivos.
    Cambiar de ordenador implica cambiar la conexión USB.
  - >-
    La variante de esta ficha termina en USB-A. En un portátil solo con USB-C
    necesitarás un adaptador o hub compatible, o elegir la otra variante.
  - >-
    No se han confirmado clics silenciosos ni programación de botones. Si
    necesitas alguna de esas funciones, no la des por hecha por el número de controles.
comunidad: >-
  Un propietario documentó en Race Dorsey un desplazamiento irregular de la
  rueda y polvo al desmontar su unidad. Es un caso individual, no evidencia de
  una tasa de fallos del PERIMICE-513. Al recibirlo, comprueba el desplazamiento
  en tus documentos y los botones de navegación dentro del plazo de devolución;
  ese relato no justifica recomendar que abras el ratón.
