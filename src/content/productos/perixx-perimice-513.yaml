en:
  nombreComercial: Perixx PERIMICE-513 USB-A
  tituloCorto: Perixx PERIMICE-513
  idealPara: A fixed Windows workstation with a preference for a cable over batteries
  veredicto: >-
    The USB-A Perixx PERIMICE-513 is a right-handed vertical mouse that sends
    input and draws power through a 1.8 m cable. It makes sense if you want no
    batteries or receiver; check that the cable reaches without restricting movement.
  resumenCompra:
    mejorPara: >-
      A Windows desktop or laptop that stays at one workstation, where you can
      leave USB-A connected and route the cable with enough slack.
    evitarSi: >-
      You want no mouse cable on your desk, Bluetooth, device switching or
      manufacturer-confirmed full button compatibility with macOS.
    alternativaDirecta: >-
      The Anker A7852 uses a USB-A receiver and two AAA batteries, not included.
      It removes the cable from the mouse movement area but still needs a USB-A port.
    decisionRapida: >-
      Measure the actual cable route from the port to the mouse area and leave
      room for movement. Confirm the black USB-A PERIMICE-513N, reference 11168;
      the USB-C version and wireless PERIMICE-713 are not the model covered here.
  metodologia:
    - >-
      We checked Perixx's official product page, variant data and PERIMICE-513
      manual, consulted on 3 October 2026. We have not tested the mouse or
      measured comfort, accuracy or lifespan.
    - >-
      We use the instructions for model 513. The manual also covers the wireless
      713; its battery and sleep instructions do not apply to this wired mouse.
  limitaciones:
    - >-
      Amazon search results can mix variants. Check the USB-A plug, black colour
      and PERIMICE-513N / PM-513N-11168 reference. The official page also shows a
      USB-C version, so its main picture alone does not identify this variant.
    - >-
      The budget tier is indicative, based on an Amazon Spain check on 3 October
      2026. It is not a fixed price or stock guarantee; check the seller, variant
      and offer conditions. No US offer is confirmed.
    - >-
      The manual and official text specify 1000 and 1600 DPI for the 513. A
      promotional image shows different settings; this profile follows the
      model-specific manual rather than that image.
    - >-
      Sources disagree on dimensions and weight. These fields remain unknown
      instead of choosing a figure or inferring a weight without the cable.
    - >-
      Perixx targets medium or large hands, but we have no verified numerical
      size cutoff. Check wheel and thumb-button reach; the manufacturer's size
      guidance does not guarantee a comfortable grip.
    - >-
      Documented compatibility is Windows plug-and-play without installing
      dedicated drivers. Full macOS or mobile support and a button-remapping
      utility are not promised here.
  paraQuienSi:
    - >-
      People wanting a right-handed mouse without buying batteries, recharging
      one or keeping track of a small receiver.
    - >-
      People with a fixed Windows workstation and a USB-A port within reach of
      the 1.8 m cable, without pulling it taut.
    - >-
      People considering Perixx's medium-to-large-hand design who can check the
      fit, including thumb-button reach, with a return option.
    - >-
      People needing a wheel click and forward/back navigation rather than
      advanced shortcut configuration.
  paraQuienNo:
    - People moving a laptop between desks who prefer not to reconnect a mouse cable each time.
    - Anyone needing Bluetooth or device switching on the mouse itself.
    - Anyone wanting direct USB-C who lacks USB-A and does not want to add an adapter.
  puntosFuertes:
    - >-
      The 1.8 m USB-A cable carries input and powers the mouse. It needs no
      batteries, charging or wireless receiver.
    - >-
      The manual identifies six controls: left click, right click, wheel click,
      DPI selector, forward and back.
    - >-
      Optical tracking with 1000 and 1600 DPI settings and Windows plug-and-play
      operation. The DPI button changes sensitivity; the higher setting does
      not inherently mean better accuracy.
  puntosDebiles:
    - >-
      The cable must reach the computer without snagging or pulling on the
      mouse. Check the route behind your desk, not just the straight-line
      distance to the port.
    - >-
      There is no Bluetooth, receiver or device switching. Moving to another
      computer means moving the USB connection.
    - >-
      This variant has a USB-A plug. A laptop with only USB-C needs a compatible
      adapter or hub, or you need to choose the other variant.
    - >-
      Quiet clicks and button programming are unconfirmed. If you need either
      feature, the number of controls is not evidence that it is available.
  comunidad: >-
    An owner documented irregular scrolling and dust inside their unit on
    Race Dorsey. This is one case, not evidence of a PERIMICE-513 failure rate.
    When yours arrives, check scrolling in your documents and the navigation
    buttons within the return period. That account does not justify recommending
    that you open the mouse.
