idealPara: "Quien quiere un escritorio elevable compacto, completo y bonito, con tablero de vidrio, cajón y cargadores USB integrados, listo para usar de una pieza"
veredicto: "El Comhar EG8 es la apuesta de FlexiSpot por el todo en uno: un escritorio elevable compacto de 120x60 cm que llega de una pieza, con tablero de vidrio templado, un cajón integrado y tres puertos de carga USB (dos A y uno C) en el propio tablero. Es el más cómodo de instalar de la gama —viene casi montado— y el más resultón de tener encima de la mesa, con panel táctil, cuatro memorias y anticolisión. A cambio hay que asumir sus límites: es de motor único, sube a 25 mm/s y el tablero soporta 50 kg, así que es un escritorio para un setup ligero-medio, no para montajes pesados de varios monitores. Frente a las estructuras de la gama E, pierde en carga y velocidad, pero gana en diseño, cajón y en no tener que comprar ni montar un tablero aparte. Para un home office con estilo y poco espacio, es de lo más apetecible."
