veredicto: "El Desktopia Lite es la versión asequible del elevable de Ergotopia, y sorprende por lo bien que cumple sin irse de precio. Es doble motor de verdad —sube rápido, a 35 mm/s, y silencioso— con un rango amplio de 62,5 a 125 cm que cubre a casi cualquiera, y aguanta 80 kg en movimiento (100 estáticos). Trae lo importante: panel LED con 4 memorias, anticolisión regulable en tres niveles, arranque y parada suaves, bloqueo y apagado automático, además de tablero de madera (haya o nogal) en varias medidas. Frente al Pro X pierde la pantalla OLED, las 9 memorias y los recordatorios, pero conserva el doble motor y la garantía de 5 años por bastante menos dinero. Frente a la gama de entrada china, gana en marca, doble motor rápido y acabado de madera. Para un home office completo de doble motor sin gastar de más, es de las compras más redondas."
