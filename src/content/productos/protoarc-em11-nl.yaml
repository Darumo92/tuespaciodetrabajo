idealPara: Manos pequeñas o medianas que alternan entre varios equipos
veredicto: El ProtoArc EM11 NL alterna entre tres equipos y carga por USB-C. Pensado para manos pequeñas o medianas; el cambio de canal es manual.
resumenCompra:
  mejorPara: Cambiar entre tres equipos con dos canales Bluetooth y un receptor USB-A, si te encaja el tamaño indicado por ProtoArc.
  evitarSi: Necesitas usarlo por cable, programar botones o usar avance y retroceso en macOS.
  alternativaDirecta: El Trust Verto Wireless usa un receptor USB y dos pilas AAA, sin cambio Bluetooth entre equipos.
  decisionRapida: Mide tu mano hasta la punta del dedo medio y comprueba el alcance de la rueda y los botones; el límite orientativo de ProtoArc ronda los 19 cm, no garantiza un ajuste cómodo.
metodologia:
  - Comparamos la ficha y la FAQ de ProtoArc con análisis independientes del EM11 NL, consultados el 30 de septiembre de 2026. No hemos probado el ratón ni medido el ruido de sus botones.
limitaciones:
  - Antes de comprar, confirma la variante EM11 NL del anuncio; el precio y las existencias actuales en Amazon.es no se han comprobado.
  - La página oficial discrepa sobre la versión de Bluetooth; esta ficha no indica una versión concreta.
  - Según la FAQ de ProtoArc, los botones de avance y retroceso no funcionan en macOS. El puerto USB-C es de carga y no se ha confirmado su uso para mover el cursor por cable.
  - La variante EM11 NL no tiene iluminación RGB; la EM11 sin NL es un modelo diferente.
  - ProtoArc describe como silenciosos los clics principales. Un análisis independiente percibió ruido en la rueda y los botones laterales; no supone una medición aplicable a todas las unidades.
paraQuienSi:
  - Quien cambia entre portátil, sobremesa y otro dispositivo y acepta pulsar el selector bajo el ratón para cambiar de canal.
  - Manos pequeñas o medianas dentro del rango orientativo de ProtoArc (menos de unos 19 cm); comprueba que alcanzas rueda y botones sin forzar la mano.
  - Quien prefiere recargar la batería en lugar de sustituir pilas.
paraQuienNo:
  - Quien necesita funcionamiento por cable USB, además de la carga.
  - Quien necesita reasignar botones o espera que una rueda escalonada gire libremente.
  - Quien necesita que todos los controles sean discretos en una sala compartida, pues el fabricante solo destaca los clics principales.
puntosFuertes:
  - Dos canales Bluetooth y receptor USB-A de 2,4 GHz para tres dispositivos, con cambio manual desde la base.
  - Batería recargable de 500 mAh y carga mediante USB-C, según ProtoArc.
  - Tres ajustes de sensibilidad publicados (1000, 1600 y 2400 DPI).
  - Clics principales descritos como silenciosos por ProtoArc; un análisis del modelo muestra un hueco bajo la base para guardar el receptor.
puntosDebiles:
  - La conexión por USB-C para datos no está confirmada; no debe confundirse carga con uso por cable.
  - La rueda tiene pasos perceptibles y no gira libremente, según la FAQ; un análisis señala que rueda y botones laterales se oyen más que los principales.
