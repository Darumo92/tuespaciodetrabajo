veredicto: "La Freedom fue la primera silla con reclinación activada por el peso del usuario: te recuestas y el respaldo y el reposacabezas te siguen sin tocar un solo mando. Esa simplicidad es su mayor virtud y también su límite; no hay ajuste lumbar discreto ni profundidad de asiento regulable, pero para quien odia configurar sillas es de lo más cómodo que existe, con 15 años de garantía."
