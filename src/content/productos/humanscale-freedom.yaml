en:
  nombreComercial: "Humanscale Freedom with headrest"
  veredicto: "The Freedom was the first chair with recline activated by the user's weight: you lean back and the backrest and headrest follow without touching a single control. That simplicity is its greatest virtue and also its limit; there's no discrete lumbar adjustment or adjustable seat depth, but for anyone who hates configuring chairs it's about as comfortable as it gets, with a 15-year warranty."
  idealPara: "Anyone wanting a premium chair that adjusts itself, with no levers or manuals"
  comunidad: "Review consensus (BTOD, The Human Solution) is very positive on immediate comfort and the dynamic headrest; criticisms point to lumbar support not being independently adjustable and a clearly premium price."
