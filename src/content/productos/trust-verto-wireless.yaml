en:
  nombreComercial: Trust Verto Wireless
  idealPara: A computer with a spare USB port and a preference for replaceable batteries
  veredicto: The Trust Verto Wireless 22879 uses a USB receiver and two AAA batteries. Trust offers no replacement receiver; check wheel and thumb-button reach.
  resumenCompra:
    mejorPara: A mostly fixed computer with a spare USB port where replaceable batteries matter more than switching devices.
    evitarSi: You need Bluetooth or official button-remapping software.
    alternativaDirecta: The ProtoArc EM11 NL has two Bluetooth channels and a rechargeable battery, as well as a USB-A receiver.
    decisionRapida: Check that the wheel and thumb buttons are within reach with your usual grip. The DPI button has no visual indication of the selected setting.
  metodologia:
    - We checked Trust's model 22879 product and support pages alongside limited purchaser comments for the same model, consulted on 30 September 2026. We have not tested the mouse or measured its endurance.
  limitaciones:
    - Before buying, confirm the wireless model 22879; the current Amazon Spain listing, price and stock have not been verified.
    - Trust offers no replacement for model 22879's paired receiver; keep it safe when carrying the mouse.
    - The mouse runs on two AAA batteries; whether they are included with the linked listing is unconfirmed.
    - Dimensions and weight were not confirmed from a readable specification for this variant. They are left unknown, as is any quiet-click feature.
    - A few purchasers of model 22879 report difficulty reaching the wheel or thumb buttons with small hands. These are individual reports, not a verified size cutoff.
  paraQuienSi:
    - People using one computer with a spare USB port who can keep track of the receiver when moving the mouse.
    - People who want to select between 800, 1200 and 1600 DPI.
    - People who prefer replacing two AAA batteries and want an on/off switch for storage.
  paraQuienNo:
    - Anyone needing Bluetooth without a receiver.
    - People who prefer USB charging to replacing two AAA batteries.
    - Anyone needing Trust-supported button remapping or a visible indicator for the selected DPI.
  puntosFuertes:
    - Trust lists a 60-degree vertical grip for model 22879.
    - The 2.4 GHz USB receiver can be stored inside the mouse; it also has an on/off switch.
    - A button selects between three DPI settings; there are also two thumb buttons.
  puntosDebiles:
    - The receiver needs a USB port; Bluetooth is not documented for this model.
    - The two AAA batteries must be replaced rather than recharged in the mouse.
    - There is no visual DPI selection indicator or official Trust utility for remapping buttons.
