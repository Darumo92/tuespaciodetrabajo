idealPara: Un equipo con puerto USB libre y preferencia por pilas sustituibles
veredicto: El Trust Verto Wireless 22879 usa receptor USB y dos pilas AAA. Trust no ofrece recambio del receptor; comprueba el alcance de la rueda y los botones.
resumenCompra:
  mejorPara: Un puesto fijo con USB disponible donde importa más sustituir pilas que alternar entre equipos.
  evitarSi: Necesitas Bluetooth o reasignar botones con software oficial.
  alternativaDirecta: El ProtoArc EM11 NL ofrece dos canales Bluetooth y batería recargable, además de receptor USB-A.
  decisionRapida: Comprueba que llegas a la rueda y los botones laterales con tu agarre habitual. Si necesitas cambiar de DPI sin mirar el cursor, este modelo no muestra el nivel seleccionado.
metodologia:
  - Revisamos la ficha y el soporte oficiales del Trust 22879 y comentarios limitados de compradores de ese modelo, consultados el 30 de septiembre de 2026. No hemos probado el ratón ni medido su duración.
limitaciones:
  - Antes de comprar, confirma que el anuncio corresponde al modelo inalámbrico 22879; el precio y las existencias actuales en Amazon.es no se han comprobado.
  - Trust no ofrece recambio para el receptor emparejado del 22879; guárdalo con cuidado al transportar el ratón.
  - La alimentación es mediante dos pilas AAA; no se ha confirmado si vienen incluidas en la oferta enlazada.
  - No se han confirmado medidas ni peso en una ficha legible para esta variante. Se dejan sin dato, igual que una función de clic silencioso.
  - Algunos compradores del modelo 22879 mencionan dificultades para alcanzar rueda o botones con manos pequeñas. Son casos individuales, no un límite de talla verificado.
paraQuienSi:
  - Quien utiliza normalmente un solo equipo con puerto USB y puede guardar el receptor cuando mueve el ratón.
  - Quien quiere ajustar la sensibilidad entre 800, 1200 y 1600 DPI.
  - Quien prefiere sustituir dos pilas AAA y valora un interruptor para apagar el ratón cuando no lo usa.
paraQuienNo:
  - Quien necesita conexión Bluetooth sin receptor.
  - Quien prefiere recargar por USB en lugar de reemplazar dos pilas AAA.
  - Quien necesita reasignación de botones respaldada por Trust o un indicador visible del nivel de DPI.
puntosFuertes:
  - Agarre vertical de 60° publicado por Trust para el modelo 22879.
  - Receptor USB de 2,4 GHz que se puede guardar en el ratón e interruptor de encendido y apagado.
  - Botón para alternar entre tres niveles de DPI y dos botones laterales.
puntosDebiles:
  - Depende de un puerto USB para el receptor; no se ha documentado Bluetooth para este modelo.
  - Las dos pilas AAA se sustituyen, no se recargan en el ratón.
  - No hay indicador visual del DPI elegido ni herramienta oficial de Trust para personalizar los botones.
