veredicto: "La Giroflex 353 es una silla giratoria suiza diseñada por Paolo Fancelli cuya gran idea es el mecanismo Automatic Move, que se autoajusta al peso del usuario sin manivelas. El asiento tiene un perfil de dos zonas que envuelve la pelvis y evita deslizarse hacia delante, con el borde delantero ligeramente inclinado para descargar los muslos. Su rango de altura arranca bastante bajo, lo que la hace apta para personas de menor estatura, un punto fuerte poco habitual. El respaldo se ofrece en tejido de punto 3D o tapizado clásico. Suma fabricación suiza con certificación Cradle to Cradle y un Red Dot 2014. Es una compra sólida para quien valora autoajuste y procedencia sobre un exceso de palancas."
