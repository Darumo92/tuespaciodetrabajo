veredicto: "La C7 Lite empaca un lumbar autoajustable de 5 ejes y reposabrazos 3D en un chasis compacto pensado para usuarios de talla S/M; su mayor debilidad es el estrecho rango de altura de asiento (solo ~2 cm de margen), lo que la hace inadecuada para personas altas."
