veredicto: "La Embody es la silla con el soporte de respaldo más sofisticado del mercado: su sistema Pixelated se adapta automáticamente a cada movimiento, pero su precio es el más alto y los reposabrazos 2D son una concesión notable en este segmento."
comunidad: "Muy polarizada: quienes encajan con su filosofía de soporte dinámico la consideran insustituible; quienes necesitan lumbar ajustable o brazos 4D se decepcionan por el precio."
