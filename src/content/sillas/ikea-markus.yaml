veredicto: "La Markus es la silla de oficina de referencia en su precio: respaldo alto de malla, lumbar integrado, base de aluminio certificada y 10 años de garantía por ~159 €. Los ajustes son mínimos (solo altura de asiento e inclinación), pero para ese precio es simplemente imbatible como primera silla de home office."
comunidad: "Icono de la comunidad de sillas de oficina a nivel mundial. En r/OfficeChairs aparece constantemente como la mejor opción de entrada y el estándar de comparación para el segmento budget. BTOD la valora por el reclinado suave y el asiento espacioso. Su punto débil más citado: el lumbar fijo no funciona para todos los torsos."
