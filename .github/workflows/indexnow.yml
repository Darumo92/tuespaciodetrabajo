name: IndexNow

on:
  workflow_dispatch:
  # PUSH TRIGGER DESACTIVADO TEMPORALMENTE (2026-08-07)
  # Motivo: la pérdida de cache el 21 Jul disparó 420 URLs en batch mode
  # y Bing aplicó supresión algorítmica. Recuperación en curso.
  # Reactivar solo cuando Bing vuelva a mostrar la web.
  # push:
  #   branches: [main]
  #   paths:
  #     - 'src/content/**'
  #     - 'src/pages/**'
  #     - 'src/layouts/**'
  #     - 'src/components/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  notify:
    name: Submit changed URLs to IndexNow
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Restore IndexNow state
        uses: actions/cache/restore@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state
          restore-keys: |
            indexnow-state-

      - name: Submit to IndexNow
        run: node scripts/indexnow.mjs

      - name: Save IndexNow state
        uses: actions/cache/save@v4
        with:
          path: .indexnow-state.json
          key: indexnow-state-${{ github.run_id }}
