# Blog Structures by Type — Voice Variation Guide
# Each structure specifies sections, voice, word count, and E-E-A-T injection points.
# Adapted for tuespaciodetrabajo.com (home office & ergonomics)

comparativa:
  name: "Comparativa de productos"
  voice: "analítico, basado en datos, experto pero accesible"
  word_count: "2000-3500"
  description: "Análisis detallado de productos con tabla comparativa y recomendación destacada"
  humanization:
    intro_variation: true  # Obligatorio: intro diferente a otros artículos de la misma categoría
    verified_eeat_signal: true
    personal_experience: "only_if_verified"
    methodology_disclosure: "required_without_verified_experience"
    asymmetric_lists: true  # Pros/contras con número variable por producto
    variable_faq_count: "3-7"  # No siempre 5
  structure:
    - section: "Introducción"
      description: "Primera frase citable con respuesta directa a la pregunta del título, sin adelantar una recomendación de producto. Sin experiencia directa verificada, declarar después límites y metodología; un dato con fuente no sustituye esa declaración. Solo entonces resumir producto destacado, contexto y keyword principal, antes de TopPick."
      eeat_injection: true  # señal verificable: metodología, dato o experiencia documentada
    - section: "TopPick"
      description: "Producto destacado con componente TopPick"
      eeat_injection: false
    - section: "ComparisonTable"
      description: "Tabla comparativa con todos los productos"
      eeat_injection: false
    - section: "Análisis detallado"
      description: "Review individual de cada producto: pros, contras, para quién es ideal. GEO: cada H3 de producto debe empezar con dato clave (precio + característica diferencial) antes de narrativa personal."
      eeat_injection: true  # datos verificados y metodología; uso propio solo si está documentado
    - section: "Guía de compra"
      description: "Criterios ergonómicos y prácticos para elegir: qué mirar, errores comunes, medidas del espacio"
      eeat_injection: true  # criterios verificables; errores propios solo si están documentados
    - section: "Nuestra recomendación"
      description: "Resumen final con recomendación por caso de uso (presupuesto, espacio disponible, tipo de trabajo)"
      eeat_injection: false
    - section: "FAQs"
      description: "3-7 preguntas de People Also Ask"
      eeat_injection: false

informativo:
  name: "Guía informativa / Tutorial"
  voice: "profesor paciente, distingue experiencia directa de investigación documental"
  word_count: "1500-2500"
  description: "Guía paso a paso sobre ergonomía, productividad o configuración del espacio de trabajo"
  humanization:
    intro_variation: true
    verified_eeat_signal: true
    personal_experience: "only_if_verified"
    methodology_disclosure: "required_without_verified_experience"
    asymmetric_lists: true
    variable_faq_count: "3-7"
  structure:
    - section: "Introducción"
      description: "Respuesta directa y contexto del teletrabajo. Sin experiencia directa verificada, declarar aquí límites y metodología; un dato con fuente no sustituye esa declaración. VARIAR el formato sin forzar anécdotas."
      eeat_injection: true  # señal verificable y metodología transparente
    - section: "Conceptos clave"
      description: "Lo que necesitas entender antes de actuar"
      eeat_injection: false
    - section: "Paso a paso / Desarrollo"
      description: "Instrucciones detalladas o explicación en profundidad"
      eeat_injection: true  # instrucciones respaldadas; experiencia propia solo si está documentada
    - section: "Errores comunes"
      description: "Qué evitar y por qué — con ejemplos verificables"
      eeat_injection: true  # evidencia real, sin fabricar errores personales
    - section: "Recomendaciones de productos (si aplica)"
      description: "Productos que ayudan, sin ser una comparativa completa. Solo si el artículo lo requiere."
      eeat_injection: false
    - section: "FAQs"
      description: "3-7 preguntas frecuentes"
      eeat_injection: false

pilar:
  name: "Página pilar / Hub"
  voice: "enciclopédico pero cercano, autoridad basada en evidencia y metodología"
  word_count: "3000-5000"
  description: "Página central de un cluster temático. Cubre el tema ampliamente y enlaza a todos los artículos del cluster."
  humanization:
    intro_variation: true
    verified_eeat_signal: true
    personal_experience: "only_if_verified"
    methodology_disclosure: "required_without_verified_experience"
    asymmetric_lists: true
    variable_faq_count: "5-8"
  structure:
    - section: "Introducción"
      description: "Qué es [tema] y por qué importa. Sin experiencia directa verificada, declarar aquí límites y metodología; un dato con fuente no sustituye esa declaración."
      eeat_injection: true
    - section: "Definición"
      description: "Qué es exactamente [tema] — los cluster pages enlazan aquí"
      eeat_injection: false
    - section: "Por qué importa"
      description: "Impacto en salud, productividad, bienestar"
      eeat_injection: true  # dato, metodología o experiencia documentada
    - section: "Tipos / Categorías"
      description: "Diferentes tipos de [tema] — cada uno enlaza a un cluster page"
      eeat_injection: false
    - section: "Cómo elegir / Guía paso a paso"
      description: "Criterios, medidas, presupuesto"
      eeat_injection: true
    - section: "Mejores prácticas"
      description: "Consejos respaldados por expertos u organismos reales"
      eeat_injection: false
    - section: "Errores comunes"
      description: "Lo que la mayoría hace mal"
      eeat_injection: true
    - section: "Productos recomendados"
      description: "Resumen con links a comparativas detalladas"
      eeat_injection: false
    - section: "FAQs"
      description: "5-8 preguntas de People Also Ask"
      eeat_injection: false

experiencia:
  name: "Experiencia personal / Review en profundidad"
  voice: "reviewer honesto, admite inconvenientes, muy específico, cuenta su historia"
  word_count: "2000-3000"
  description: "Análisis basado en experiencia directa documentada con un producto o setup concreto. No usar este formato sin experiencia directa verificable."
  humanization:
    intro_variation: true
    min_personal_experience: 5  # Este formato ES experiencia personal
    asymmetric_lists: true
    variable_faq_count: "3-6"
  structure:
    - section: "Resumen rápido"
      description: "Veredicto en 2-3 frases para quien tiene prisa"
      eeat_injection: false
    - section: "Por qué lo compré / elegí"
      description: "Contexto personal documentado: motivo real de la elección y criterios de compra"
      eeat_injection: true
    - section: "Primeras impresiones"
      description: "Unboxing o montaje solo si se realizó y puede describirse con precisión; calidad percibida real"
      eeat_injection: true
    - section: "Uso diario"
      description: "Uso real durante el periodo que pueda confirmarse, sin ampliar horas ni duración"
      eeat_injection: true
    - section: "Puntos fuertes"
      description: "Lo mejor del producto actual, con datos concretos; comparar con el setup anterior solo si está documentado"
      eeat_injection: true
    - section: "Puntos débiles"
      description: "Lo peor, sin disimular. Qué cambiarías."
      eeat_injection: true
    - section: "Alternativas que consideré"
      description: "Alternativas verificadas; no afirmar que se consideraron o descartaron si no está documentado"
      eeat_injection: false
    - section: "Veredicto tras el uso documentado"
      description: "Valoración limitada al periodo real que pueda confirmarse. ¿Para quién sí y para quién no?"
      eeat_injection: false
    - section: "FAQs"
      description: "3-6 preguntas frecuentes"
      eeat_injection: false

setup:
  name: "Setup / Showcase de espacio de trabajo"
  voice: "entusiasta pero práctico, comparte detalles útiles, inspira sin presumir"
  word_count: "1500-2500"
  description: "Presentación de un setup de home office real con análisis de cada componente. No usar este formato sin experiencia directa verificable."
  humanization:
    intro_variation: true
    min_personal_experience: 4
    asymmetric_lists: true
    variable_faq_count: "3-5"
  structure:
    - section: "Visión general"
      description: "Foto real del setup y contexto documentado: tipo de trabajo y espacio disponible; presupuesto solo si está confirmado"
      eeat_injection: true
    - section: "La silla"
      description: "Silla real, motivo documentado, experiencia directa y precio solo si está confirmado"
      eeat_injection: true
    - section: "El escritorio"
      description: "Tipo, medidas, organización"
      eeat_injection: true
    - section: "Monitores y pantalla"
      description: "Monitor(es), soporte, configuración"
      eeat_injection: true
    - section: "Periféricos"
      description: "Teclado, ratón, webcam, micro"
      eeat_injection: false
    - section: "Iluminación y ambiente"
      description: "Condiciones reales y verificables de luz y ambiente; no añadir elementos que el setup no tiene"
      eeat_injection: true
    - section: "Lo que cambiaría"
      description: "Limitaciones observadas y mejoras solo si están realmente planeadas"
      eeat_injection: true
    - section: "Presupuesto desglosado"
      description: "Tabla con costes únicamente cuando existen importes verificables; omitir cifras no confirmadas"
      eeat_injection: false
    - section: "FAQs"
      description: "3-5 preguntas frecuentes"
      eeat_injection: false
